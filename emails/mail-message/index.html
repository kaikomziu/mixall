<!doctype html>
<html lang="ja">
  <body style="margin:0;padding:24px;background:#f5f7fb;color:#172033;font-family:Arial,'Noto Sans JP',sans-serif;line-height:1.7;">
    <main style="max-width:620px;margin:0 auto;padding:28px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;">
      <p style="margin:0 0 8px;color:#5263d8;font-weight:700;">MixAll + Mail</p>
      <h1 style="margin:0 0 16px;font-size:22px;">{{subject}}</h1>
      <p>{{senderName}} さんからMixAll +経由でメールが届きました。</p>
      <p style="color:#64748b;font-size:13px;">MixAll +アカウント: {{senderAccount}}</p>
      <div style="margin:20px 0;padding:18px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;">{{body}}</div>
      <p style="color:#64748b;font-size:13px;">添付ファイルがある場合は、このメールに添付されています。Gmailなどから直接返信してもMixAll +の受信トレイには届きません。MixAll + Mailにログインして返信してください。</p>
      <p><a href="{{mailUrl}}" style="display:inline-block;padding:11px 18px;background:#5263d8;color:#ffffff;border-radius:10px;text-decoration:none;font-weight:700;">MixAll + Mailを開く</a></p>
      <hr style="border:0;border-top:1px solid #e2e8f0;margin:24px 0;">
      <p style="margin:0;color:#64748b;font-size:12px;">このメールはMixAll +の送信機能から送信されました。</p>
    </main>
  </body>
</html>
