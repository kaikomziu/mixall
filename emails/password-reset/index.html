<!doctype html>
<html lang="ja">
  <body style="margin:0;padding:24px;background:#f5f7fb;color:#172033;font-family:Arial,'Noto Sans JP',sans-serif;line-height:1.7;">
    <main style="max-width:560px;margin:0 auto;padding:28px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;">
      <p style="margin:0 0 8px;color:#5263d8;font-weight:700;">MixAll + アカウント保護</p>
      <h1 style="margin:0 0 16px;font-size:22px;">パスワード再設定</h1>
      <p>{{displayName}} さん、パスワード再設定のリクエストを受け付けました。</p>
      <p><a href="{{resetUrl}}" style="display:inline-block;padding:12px 20px;background:#5263d8;color:#ffffff;border-radius:10px;text-decoration:none;font-weight:700;">新しいパスワードを設定</a></p>
      <p>このリンクは<strong>{{expiresMinutes}}分間</strong>有効で、一度だけ使えます。</p>
      <p>ボタンが開けない場合は、次のURLをブラウザーに貼り付けてください:<br><a href="{{resetUrl}}">{{resetUrl}}</a></p>
      <p style="color:#64748b;font-size:13px;">この操作に心当たりがなければ、メールを無視してください。リンクを使わない限り、パスワードは変更されません。</p>
      <hr style="border:0;border-top:1px solid #e2e8f0;margin:24px 0;">
      <p style="margin:0;color:#64748b;font-size:12px;">MixAll +</p>
    </main>
  </body>
</html>
