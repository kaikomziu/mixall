<!doctype html>
<html lang="ja">
  <body style="margin:0;padding:24px;background:#f5f7fb;color:#172033;font-family:Arial,'Noto Sans JP',sans-serif;line-height:1.7;">
    <main style="max-width:560px;margin:0 auto;padding:28px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;">
      <p style="margin:0 0 8px;color:#5263d8;font-weight:700;">MixAll + アカウント保護</p>
      <h1 style="margin:0 0 16px;font-size:22px;">回復用メールアドレスの確認</h1>
      <p>{{displayName}} さん、MixAll +の回復用メールアドレスを設定するリクエストを受け付けました。</p>
      <p>確認コード:</p>
      <p style="margin:8px 0 20px;padding:16px;background:#f0f3ff;border-radius:12px;text-align:center;font-size:30px;font-weight:800;letter-spacing:8px;">{{code}}</p>
      <p>このコードは<strong>{{expiresMinutes}}分間</strong>有効です。MixAll +の画面に戻って入力してください。</p>
      <p style="color:#64748b;font-size:13px;">この操作に心当たりがなければ、このメールを無視してください。コードを他人に教えないでください。</p>
      <hr style="border:0;border-top:1px solid #e2e8f0;margin:24px 0;">
      <p style="margin:0;color:#64748b;font-size:12px;">MixAll + — ご本人が管理する回復先アドレスだけを登録してください。</p>
    </main>
  </body>
</html>
