</head><body><header class="top"><div class="brand"><a href="/" style="color:inherit"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/">トップ</a><a href="/Pocket">Pocket</a><a href="/Uch">Uch</a></nav></header><main><div class="card"><h2>共有カレンダー</h2><p class="muted">ルームに紐づかない独立した予定表です。必要な数だけ作成できます。</p><div class="row"><input id="calendarTitle" placeholder="予定表名" style="flex:1"><button id="createCalendar">予定表を作成</button></div><div id="calendarError" class="error"></div></div><div class="card"><h3>予定表一覧</h3><div id="calendarList">読み込み中...</div></div><div class="card" id="calendarPanel" style="display:none"><h3 id="selectedTitle"></h3><div class="row"><input id="eventTitle" placeholder="予定タイトル" style="flex:1"><input id="eventStart" type="datetime-local"><input id="eventEnd" type="datetime-local"><button id="addEvent">予定を追加</button></div><input id="shareEmail" placeholder="共有するアカウント（例: user@bix.3erver）"><button id="shareCalendar" class="secondary">共有する</button><div id="eventList" style="margin-top:14px"></div></div></main><script>
const s=Netrify.requireLogin();let selected=null;const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=(body)=>Netrify.api('/.netlify/functions/calendar',{token:s.token,...body});
async function load(){const d=await api({action:'list'});document.getElementById('calendarList').innerHTML=d.calendars.map(c=>`<div class="bot-item"><span><strong>${esc(c.title)}</strong><small class="muted"> ${c.public?'公開':'非公開'}・${c.events.length}件</small></span><span><button class="secondary" data-open="${c.id}">開く</button>${c.ownerEmail===s.email?`<button class="ghost" data-delete="${c.id}">削除</button>`:''}</span></div>`).join('')||'<p class="muted">予定表がありません。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCalendar(d.calendars.find(c=>c.id===b.dataset.open)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('この予定表を削除しますか？')){await api({action:'delete',calendarId:b.dataset.delete});load();}})}
function render(){document.getElementById('selectedTitle').textContent=selected.title;document.getElementById('eventList').innerHTML=(selected.events||[]).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>`<div class="bot-item"><span><strong>${esc(e.title)}</strong><br><small>${esc(e.start)}${e.end?'〜'+esc(e.end):''}<br>${esc(e.description)}</small></span><button class="ghost" data-event-delete="${e.id}">削除</button></div>`).join('')||'<p class="muted">予定がありません。</p>';document.querySelectorAll('[data-event-delete]').forEach(b=>b.onclick=async()=>{selected=(await api({action:'deleteEvent',calendarId:selected.id,eventId:b.dataset.eventDelete})).calendar;render();});}
function openCalendar(c){selected=c;document.getElementById('calendarPanel').style.display='block';render();}document.getElementById('createCalendar').onclick=async()=>{try{await api({action:'create',title:document.getElementById('calendarTitle').value});document.getElementById('calendarTitle').value='';load();}catch(e){document.getElementById('calendarError').textContent=e.message;}};document.getElementById('addEvent').onclick=async()=>{try{selected=(await api({action:'event',calendarId:selected.id,title:eventTitle.value,start:eventStart.value,end:eventEnd.value})).calendar;eventTitle.value='';render();}catch(e){alert(e.message);}};document.getElementById('shareCalendar').onclick=async()=>{try{selected=(await api({action:'share',calendarId:selected.id,email:shareEmail.value})).calendar;shareEmail.value='';alert('共有しました');}catch(e){alert(e.message);}};load();
</script></body></html>
