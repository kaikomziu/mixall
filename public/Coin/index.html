<main><div class="card"><h2>MixAll + Coin</h2><p class="muted">現在ログインしているアカウントの所持Coinです。</p><div id="balance" style="font-size:2.4rem;font-weight:bold">読み込み中...</div><p id="account" class="muted"></p><p id="note" class="muted"></p><div id="error" class="error"></div></div><div class="card" id="earningCard" style="display:none"><h3>Coinを稼ぐ</h3><p class="muted">運営が選定したCoin稼ぎゲームでスコアを獲得できます。</p><button type="button" id="earningButton">稼ぐ</button><div id="earningSites" style="display:none;margin-top:12px"></div></div></main>
<script src="/js/auth.js"></script><script>
const session=Netrify.requireLogin();
async function load(){if(!session)return;try{const res=await fetch('/.netlify/functions/coins?token='+encodeURIComponent(session.token));const data=await res.json();if(!res.ok)throw new Error(data.error||'残高を取得できません');document.getElementById('balance').textContent=data.unlimited?'無限 Coin':`${Number(data.balance||0).toLocaleString('ja-JP')} Coin`;document.getElementById('account').textContent=data.email;document.getElementById('note').textContent=data.unlimited?'運営・公認アカウント特典により、Coin消費は無料扱いです。':'PoikatsuやCoin対応サイトで獲得した残高が表示されます。';const sites=await (await fetch('/.netlify/functions/coins?action=earningSites&token='+encodeURIComponent(session.token))).json();if((sites.sites||[]).length){document.getElementById('earningCard').style.display='block';document.getElementById('earningButton').onclick=()=>{const el=document.getElementById('earningSites');el.style.display=el.style.display==='none'?'block':'none';el.innerHTML=(sites.sites||[]).map(site=>`<div class="admin-item"><strong>${String(site.title).replace(/[&<>]/g,'')}</strong><p class="muted">${String(site.description||'Coinを稼げるゲーム')}</p><a class="secondary" href="${site.url}" target="_blank" rel="noopener">ゲームを開く</a></div>`).join('');};}}catch(e){document.getElementById('error').textContent=e.message}}load();setInterval(load,15000);
</script></body></html>
