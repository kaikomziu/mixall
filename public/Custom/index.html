<body>
<header class="top">
  <div class="brand"><a href="/" style="color:inherit;"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div>

    <a href="/Custom" class="active">カスタム</a>
    <a href="/">トップへ</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>すぐにゲームへ入る</h2>
    <p class="muted">キャラクター設定は不要です。標準キャラクターでそのままワールドに参加できます。</p>
    <a class="button" href="#roomList">公開ワールドを選ぶ</a>
  </div>
  <div class="card">
    <h2>3Dワールドを作る</h2><p class="muted">アセットをドラッグで配置し、Studio風のプログラムブロックで動かす3Dゲームを作れます。</p><p><a class="secondary" href="/Custom/builder.html">3Dゲームを作る（ワールドスタジオ）</a></p>
    <input type="text" id="roomName" placeholder="ワールド名" />
    <div class="row" style="margin-bottom:10px;">
      <label class="muted"><input type="radio" name="visibility" value="public" checked style="width:auto;" /> パブリック(誰でも参加可)</label>
      <label class="muted"><input type="radio" name="visibility" value="private" style="width:auto;" /> プライベート(パスワード制)</label>
    </div>
    <input type="password" id="roomPassword" placeholder="パスワード(プライベートの場合)" style="display:none;" />
    <div class="error" id="createError"></div>
    <button id="createSubmit">ワールドを作成して入る</button>
  </div>

  <div class="card">
    <h2>ワールド一覧</h2>
    <div id="roomList"><p class="muted">読み込み中...</p></div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script>
const session = Netrify.requireLogin();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- ワールド作成 ---
document.querySelectorAll('input[name="visibility"]').forEach(r => {
  r.onchange = () => { document.getElementById('roomPassword').style.display = r.value === 'private' && r.checked ? 'block' : 'none'; };
});

document.getElementById('createSubmit').onclick = async () => {
  const errEl = document.getElementById('createError');
  errEl.textContent = '';
  const name = document.getElementById('roomName').value.trim();
  const visibility = document.querySelector('input[name="visibility"]:checked').value;
  const password = document.getElementById('roomPassword').value;
  try {
    const data = await Netrify.api('/.netlify/functions/custom', { action: 'createRoom', token: session.token, name, visibility, password });
    window.location.href = '/Custom/room.html?id=' + encodeURIComponent(data.room.id);
  } catch (e) {
    errEl.textContent = e.message;
  }
};

// --- ワールド一覧 ---
async function loadRooms() {
  const res = await fetch('/.netlify/functions/custom?token=' + encodeURIComponent(session.token));
  const data = await res.json();
  const el = document.getElementById('roomList');
  if (!data.rooms || data.rooms.length === 0) {
    el.innerHTML = '<p class="muted">まだワールドがありません。最初の1つを作ってみましょう。</p>';
    return;
  }
  el.innerHTML = data.rooms.map(r => `
    <div class="thread-list-item">
      <div>
        <div class="title">${escapeHtml(r.name)} ${r.visibility === 'private' ? '🔒' : ''}</div>
        <div class="meta">プレイ中: ${r.playerCount}人</div>
      </div>
      <button type="button" class="secondary" data-join="${r.id}" data-private="${r.visibility === 'private'}">入る</button>
      ${(r.ownerEmail === session.email || session.isAdmin || session.isDeputyAdmin) ? `<button type="button" class="ghost" data-delete-room="${r.id}">削除</button>` : ''}
    </div>
  `).join('');

  el.querySelectorAll('[data-join]').forEach(btn => {
    btn.onclick = async () => {
      const roomId = btn.dataset.join;
      let password;
      if (btn.dataset.private === 'true') {
        password = prompt('このワールドのパスワードを入力してください');
        if (password === null) return;
      }
      try {
        await Netrify.api('/.netlify/functions/custom', { action: 'joinRoom', token: session.token, roomId, password });
        window.location.href = '/Custom/room.html?id=' + encodeURIComponent(roomId);
      } catch (e) {
        alert(e.message);
      }
    };
  });
  el.querySelectorAll('[data-delete-room]').forEach(btn => {
    btn.onclick = async () => {
      const room = data.rooms.find(item => item.id === btn.dataset.deleteRoom);
      if (!room || !confirm(`「${room.name}」を削除しますか？このルームには入れなくなります。`)) return;
      btn.disabled = true;
      try {
        await Netrify.api('/.netlify/functions/custom', { action:'deleteRoom', token:session.token, roomId:room.id });
        await loadRooms();
      } catch (error) {
        btn.disabled = false;
        alert(error.message);
      }
    };
  });
}

loadRooms();
setInterval(loadRooms, 8000);
</script>
</body>
</html>
