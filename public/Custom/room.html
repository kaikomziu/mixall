function material(color){return new THREE.MeshStandardMaterial({color:new THREE.Color(color||'#5b8cff'),roughness:.78})}

function worldMesh(o){let m;if(o.type==='sphere')m=new THREE.Mesh(new THREE.SphereGeometry(.7,24,18),material(o.color));else if(o.type==='cylinder')m=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.6,24),material(o.color));else if(o.type==='platform')m=new THREE.Mesh(new THREE.BoxGeometry(2.8,.3,2.8),material(o.color));else if(o.type==='tree'){m=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.2,12),material('#8a5a38'));trunk.position.y=.6;const crown=new THREE.Mesh(new THREE.SphereGeometry(.75,18,14),material('#39a96b'));crown.position.y=1.5;m.add(trunk,crown)}else m=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),material(o.color));m.position.set(Number(o.x)||0,Number(o.y)||0,Number(o.z)||0);m.scale.setScalar(Number(o.scale)||1);m.userData.objectId=o.id;return m}

function makeCharacter(avatar={},mine=false){const a={...NetrifyAvatar.DEFAULT,...avatar},root=new THREE.Group(),skin=material(a.skin),hair=material(a.hair),clothes=material(a.outfit),eyes=material(a.eyes);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.66,5,10),clothes);torso.position.y=1.05;root.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,20,16),skin);head.position.y=1.77;root.add(head);if(a.hairStyle!=='bald'){const cap=new THREE.Mesh(new THREE.SphereGeometry(.258,18,10,0,Math.PI*2,0,Math.PI*.55),hair);cap.position.y=1.84;root.add(cap);if(a.hairStyle==='long'){for(const side of [-1,1]){const lock=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.42,4,8),hair);lock.position.set(side*.22,1.57,0);root.add(lock)}}if(a.hairStyle==='bun'){const bun=new THREE.Mesh(new THREE.SphereGeometry(.11,12,10),hair);bun.position.set(0,2.06,-.12);root.add(bun)}}for(const side of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),eyes);eye.position.set(side*.085,1.79,.225);root.add(eye)}const armL=new THREE.Mesh(new THREE.CapsuleGeometry(.085,.4,4,8),clothes),armR=armL.clone(),legL=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.43,4,8),material('#283347')),legR=legL.clone();armL.position.set(-.37,1.08,0);armR.position.set(.37,1.08,0);legL.position.set(-.14,.38,0);legR.position.set(.14,.38,0);root.add(armL,armR,legL,legR);root.userData={mine,armL,armR,legL,legR,avatarKey:JSON.stringify(a),target:new THREE.Vector3()};return root}
function posForParticipant(p){if(p.position&&typeof p.position==='object')return{x:Number(p.position.x)||0,y:Number(p.position.y)||0,z:Number(p.position.z)||0};return{x:(Number(p.x)-500)/45,y:0,z:(Number(p.y)-300)/45}}
function updateCharacters(){const participants=latestRoom?.participants||{};for(const [email,p] of Object.entries(participants)){if(email===session.email)continue;const pos=posForParticipant(p);let c=characters.get(email);const key=JSON.stringify(p.avatar||{});if(!c||c.userData.avatarKey!==key){if(c)scene.remove(c);c=makeCharacter(p.avatar,false);scene.add(c);characters.set(email,c)}c.userData.target.set(pos.x,pos.y,pos.z);c.userData.targetRotation=Number(p.rotation)||0}for(const [email,c] of characters){if(!participants[email]||email===session.email){scene.remove(c);characters.delete(email)}}const el=document.getElementById('playerList');el.innerHTML=Object.entries(participants).map(([email,p])=>`<div class="player-item"><span>${esc(p.displayName||email)}${email===session.email?'（自分）':''}</span>${email!==session.email?`<span><button class="ghost" data-call="${esc(email)}" data-mode="audio">音声</button> <button class="ghost" data-call="${esc(email)}" data-mode="video">ビデオ</button></span>`:'<small>接続中</small>'}</div>`).join('')||'<p class="muted">まだ誰もいません。</p>';el.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>window.Netrify?.startCall(b.dataset.call,b.dataset.mode))}
function renderLocalCharacter(){let c=characters.get(session.email);if(!c||c.userData.avatarKey!==JSON.stringify(localAvatar)){if(c)scene.remove(c);c=makeCharacter(localAvatar,true);scene.add(c);characters.set(session.email,c)}c.position.set(my.x,my.y,my.z);return c}
function updateCamera(){const c=characters.get(session.email);const target=new THREE.Vector3(my.x,my.y+1.25,my.z);const cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*cp*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*cp*distance);camera.lookAt(target)}
function resize(){const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}addEventListener('resize',resize);setTimeout(resize,30);
function updateInput(){let x=inputX+keySide,y=inputY+keyForward;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);const desiredX=(rx*x+fx*(-y))*speed,desiredZ=(rz*x+fz*(-y))*speed,blend=1-Math.exp(-(len>.03?11:8)*Math.min(deltaTime,.05));my.vx+=(desiredX-my.vx)*blend;my.vz+=(desiredZ-my.vz)*blend}
let deltaTime=0;function collideAndFall(dt){const oldBottom=my.y;my.vy-=gravity*dt;my.y+=my.vy*dt;if(my.y<=floorY){my.y=floorY;my.vy=0;my.onGround=true}else my.onGround=false;for(const o of project?.scene?.objects||[]){const mesh=objectMeshes.get(o.id);if(!mesh)continue;const s=sizeOf(o),top=(Number(o.y)||0)+s.y/2,halfX=s.x/2,halfZ=s.z/2;if(my.vy<=0&&oldBottom>=top-.06&&my.y<=top&&Math.abs(my.x-(Number(o.x)||0))<=halfX+.24&&Math.abs(my.z-(Number(o.z)||0))<=halfZ+.24){my.y=top;my.vy=0;my.onGround=true}}}
function animateCharacters(dt){const local=renderLocalCharacter(),moving=Math.hypot(my.vx,my.vz)>.25,phase=performance.now()*.012;local.position.set(my.x,my.y,my.z);if(moving){my.rotation=Math.atan2(my.vx,my.vz);local.rotation.y=my.rotation;local.userData.legL.rotation.x=Math.sin(phase)*.65;local.userData.legR.rotation.x=-Math.sin(phase)*.65;local.userData.armL.rotation.x=-Math.sin(phase)*.45;local.userData.armR.rotation.x=Math.sin(phase)*.45}else{local.userData.legL.rotation.x=0;local.userData.legR.rotation.x=0;local.userData.armL.rotation.x=0;local.userData.armR.rotation.x=0}for(const [email,c] of characters){if(email===session.email)continue;c.position.lerp(c.userData.target,1-Math.exp(-10*dt));const turn=Math.atan2(Math.sin((c.userData.targetRotation||0)-c.rotation.y),Math.cos((c.userData.targetRotation||0)-c.rotation.y));c.rotation.y+=turn*(1-Math.exp(-10*dt))}}
function sendPosition(force=false){if(!roomId||Date.now()-lastSent<220&&!force)return;lastSent=Date.now();Netrify.api('/api/custom',{action:'updateParticipant',token:session.token,roomId,position:{x:my.x,y:my.y,z:my.z},x:500+my.x*45,y:300+my.z*45,avatar:localAvatar,rotation:my.rotation,displayName:session.displayName}).catch(()=>{})}
function jump(){if(my.onGround){my.vy=jumpSpeed;my.onGround=false}}
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','arrowup'].includes(k)){keyForward=-1;e.preventDefault()}if(['s','arrowdown'].includes(k)){keyForward=1;e.preventDefault()}if(['a','arrowleft'].includes(k)){keySide=-1;e.preventDefault()}if(['d','arrowright'].includes(k)){keySide=1;e.preventDefault()}if(e.code==='Space'){jump();e.preventDefault()}});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['w','arrowup','s','arrowdown'].includes(k))keyForward=0;if(['a','arrowleft','d','arrowright'].includes(k))keySide=0});
const pad=document.getElementById('touchpad'),thumb=document.getElementById('stickThumb');function setStick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy),scale=len>max?max/len:1;inputX=dx*scale/max;inputY=dy*scale/max;thumb.style.left=`${50+inputX*34}%`;thumb.style.top=`${50+inputY*34}%`}pad.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;pad.setPointerCapture(e.pointerId);setStick(e);e.preventDefault()});pad.addEventListener('pointermove',e=>{if(stickPointer===e.pointerId)setStick(e)});function resetStick(e){if(stickPointer!==e.pointerId)return;stickPointer=null;inputX=0;inputY=0;thumb.style.left='50%';thumb.style.top='50%'}pad.addEventListener('pointerup',resetStick);pad.addEventListener('pointercancel',resetStick);
let cameraDrag=null;function canvasPointerDown(e){if(e.target===pad||pad.contains(e.target)||e.target===document.getElementById('jump'))return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});if(pointers.size>=2){cameraDrag=null;gestureDistance=pointerSeparation();return}if(e.pointerType==='mouse')cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY}}function pointerSeparation(){const p=[...pointers.values()];return p.length>=2?Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y):0}function canvasPointerMove(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});if(pointers.size>=2){const d=pointerSeparation();if(gestureDistance&&d)distance=Math.max(3,Math.min(20,distance*gestureDistance/d));gestureDistance=d;return}if(cameraDrag?.id===e.pointerId){yaw-=(e.clientX-cameraDrag.x)*.008;pitch=Math.max(.08,Math.min(.72,pitch+(e.clientY-cameraDrag.y)*.002));cameraDrag={id:e.pointerId,x:e.clientX,y:e.clientY}}}function canvasPointerUp(e){pointers.delete(e.pointerId);if(pointers.size<2)gestureDistance=null;if(cameraDrag?.id===e.pointerId)cameraDrag=null}canvas.addEventListener('pointerdown',canvasPointerDown);canvas.addEventListener('pointermove',canvasPointerMove);canvas.addEventListener('pointerup',canvasPointerUp);canvas.addEventListener('pointercancel',canvasPointerUp);canvas.addEventListener('wheel',e=>{distance=Math.max(3,Math.min(20,distance+e.deltaY*.01));e.preventDefault()},{passive:false});document.getElementById('resetCamera').onclick=()=>{yaw=0;pitch=.28;distance=7};
let activeProgramCount=0,worldVariables={},touching=new Set(),roomAlive=true,speechTimer=0;function speak(text,seconds){const el=document.getElementById('speech');el.textContent=String(text||'').slice(0,250);el.style.display='block';clearTimeout(speechTimer);speechTimer=setTimeout(()=>el.style.display='none',Math.max(500,Math.min(15000,(Number(seconds)||2)*1000)))}function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}function objectDistance(o){return Math.hypot(my.x-(Number(o.x)||0),my.y-(Number(o.y)||0),my.z-(Number(o.z)||0))}
async function tween(mesh,from,to,duration,rotFrom=null,rotTo=null){const start=performance.now(),ms=Math.max(80,Math.min(30000,(Number(duration)||1)*1000));while(roomAlive&&performance.now()-start<ms){const t=Math.min(1,(performance.now()-start)/ms),q=t*t*(3-2*t);mesh.position.set(from.x+(to.x-from.x)*q,from.y+(to.y-from.y)*q,from.z+(to.z-from.z)*q);if(rotFrom!==null)mesh.rotation.y=rotFrom+(rotTo-rotFrom)*q;await new Promise(requestAnimationFrame)}if(roomAlive){mesh.position.copy(to);if(rotTo!==null)mesh.rotation.y=rotTo}}
async function runBlocks(o,blocks,budget){for(const b of blocks||[]){if(!roomAlive||budget.remaining--<=0)return;const mesh=objectMeshes.get(o.id);if(!mesh)return;const v=b.values||{},seconds=Math.max(.08,Math.min(30,Number(v.seconds)||1));if(b.type==='move'){const from=mesh.position.clone(),to=from.clone().add(new THREE.Vector3(Number(v.x)||0,Number(v.y)||0,Number(v.z)||0));await tween(mesh,from,to,seconds);o.x=to.x;o.y=to.y;o.z=to.z}else if(b.type==='turn'){const from=mesh.position.clone();await tween(mesh,from,from,seconds,mesh.rotation.y,mesh.rotation.y+(Number(v.degrees)||0)*Math.PI/180)}else if(b.type==='jump'){const base=mesh.position.clone(),height=Math.max(0,Math.min(30,Number(v.height)||2)),start=performance.now(),ms=seconds*1000;while(roomAlive&&performance.now()-start<ms){const t=(performance.now()-start)/ms;mesh.position.y=base.y+Math.sin(Math.PI*t)*height;await new Promise(requestAnimationFrame)}mesh.position.copy(base)}else if(b.type==='wait')await sleep(seconds*1000);else if(b.type==='repeat'){const times=Math.max(1,Math.min(50,Math.floor(Number(v.count)||1)));for(let i=0;i<times&&budget.remaining>0;i++)await runBlocks(o,b.children,budget)}else if(b.type==='if_near'){const radius=Math.max(.1,Math.min(60,Number(v.radius)||4));if(objectDistance(o)<=radius)await runBlocks(o,b.children,budget)}else if(b.type==='say'){speak(v.text,seconds);await sleep(seconds*1000)}else if(b.type==='set_variable')worldVariables[String(v.name||'score').slice(0,40)]=Number(v.value)||0;else if(b.type==='change_variable'){const name=String(v.name||'score').slice(0,40);worldVariables[name]=(Number(worldVariables[name])||0)+(Number(v.value)||0)}}}
function runScript(o,script){if(activeProgramCount>24)return;activeProgramCount++;runBlocks(o,script.blocks,{remaining:1200}).catch(console.error).finally(()=>activeProgramCount--)}function checkTouchScripts(){const next=new Set();for(const o of project?.scene?.objects||[]){const scripts=(o.scripts||[]).filter(s=>s.trigger==='touch');if(!scripts.length)continue;const radius=Math.max(1,sizeOf(o).x/2+1.1),near=Math.hypot(my.x-(Number(o.x)||0),my.z-(Number(o.z)||0))<radius;if(near){next.add(o.id);if(!touching.has(o.id))scripts.forEach(s=>runScript(o,s))}}touching=next}
let lastLoadAt=0;async function loadRoom(){if(roomLoading||!roomId)return;roomLoading=true;try{const res=await fetch(`/api/custom?roomId=${encodeURIComponent(roomId)}&token=${encodeURIComponent(session.token)}`);if(!res.ok){const data=await res.json().catch(()=>({}));throw new Error(data.error||'ワールドを読み込めません')}const data=await res.json();latestRoom=data.room;document.getElementById('roomName').textContent=latestRoom.name+(latestRoom.projectId?' · 3D':'');if(latestRoom.projectId&&(!project||project.id!==latestRoom.projectId)){const pr=await fetch(`/api/custom?projectId=${encodeURIComponent(latestRoom.projectId)}&token=${encodeURIComponent(session.token)}`);if(!pr.ok)throw new Error('ゲームデータを読み込めません');project=(await pr.json()).project;const spawn=project.scene?.spawn||{x:0,y:0,z:0};my.x=Number(spawn.x)||0;my.y=Number(spawn.y)||0;my.z=Number(spawn.z)||0;drawWorld();for(const o of project.scene?.objects||[])for(const script of o.scripts||[])if(script.trigger==='start')runScript(o,script)}updateCharacters();drawChat(latestRoom.messages);document.getElementById('roomError').textContent='';lastLoadAt=Date.now()}catch(error){document.getElementById('roomError').textContent=error.message}finally{roomLoading=false}}
function drawChat(messages){const el=document.getElementById('chatList');el.innerHTML=(messages||[]).map(m=>`<div><b>${esc(m.authorName)}</b>: ${esc(m.text)}</div>`).join('')||'<p class="muted">まだメッセージがありません。</p>';el.scrollTop=el.scrollHeight}
document.getElementById('chatSend').onclick=async()=>{const el=document.getElementById('chatInput'),text=el.value.trim();if(!text)return;try{await Netrify.api('/api/custom',{action:'sendMessage',token:session.token,roomId,text,displayName:session.displayName});el.value='';await loadRoom()}catch(error){document.getElementById('roomError').textContent=error.message}};document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('chatSend').click()});document.getElementById('leaveBtn').onclick=async()=>{try{await Netrify.api('/api/custom',{action:'leaveRoom',token:session.token,roomId});location.href='/Custom'}catch(error){document.getElementById('roomError').textContent=error.message}};
let frameCount=0;function animate(now){requestAnimationFrame(animate);deltaTime=Math.min(.05,(now-lastFrame)/1000||0);lastFrame=now;updateInput();const before=new THREE.Vector3(my.x,my.y,my.z);my.x+=my.vx*deltaTime;my.z+=my.vz*deltaTime;collideAndFall(deltaTime);animateCharacters(deltaTime);checkTouchScripts();updateCamera();renderer.render(scene,camera);if(++frameCount%6===0)sendPosition();document.getElementById('positionHud').textContent=`X ${my.x.toFixed(1)} · Y ${my.y.toFixed(1)} · Z ${my.z.toFixed(1)}${my.onGround?'':' · 空中'}`}
addEventListener('beforeunload',()=>{roomAlive=false});resize();requestAnimationFrame(animate);loadRoom();setInterval(loadRoom,1800);
</script></body></html>
