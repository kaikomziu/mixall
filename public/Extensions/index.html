<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拡張機能 - MixAll +</title><link rel="stylesheet" href="/css/style.css"><script src="/js/auth.js"></script><script src="/js/settings.js"></script><style>
.extension-shell{max-width:1120px;margin:auto;padding:24px 16px 100px}.extension-toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.extension-toolbar input{max-width:460px;margin:0}.extension-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:20px}.extension-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;min-height:220px;display:flex;flex-direction:column;gap:10px}.extension-head{display:flex;gap:12px;align-items:flex-start}.extension-icon{font-size:2.5rem;width:58px;height:58px;display:grid;place-items:center;border-radius:12px;background:var(--panel-2);border:1px solid var(--border)}.extension-card h2{font-size:1.05rem;margin:0}.extension-card p{color:var(--text-dim);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.extension-meta{font-size:.78rem;color:var(--text-dim)}.extension-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.extension-modal{position:fixed;inset:5%;z-index:100;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 60px #0008;display:flex;flex-direction:column;overflow:hidden}.extension-modal[hidden]{display:none}.extension-modal header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}.extension-modal iframe{border:0;flex:1;background:#fff}.extension-note{margin-top:16px;padding:12px;border-left:3px solid var(--accent);color:var(--text-dim);background:var(--panel-2)}
</style><meta property="og:type" content="website"><meta property="og:site_name" content="MixAll +"><meta property="og:title" content="MixAll +拡張機能"><meta property="og:description" content="MixAll +拡張機能のページ"><meta property="og:image" content="https://mix-alls.netlify.app/ogp/16-extensions.jpg?v=20261012-2">

</head><body><header class="top"><div class="brand"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span> / 拡張機能</div><nav class="services"><a href="/">トップ</a><a class="active" href="/Extensions/">拡張機能</a><a href="/admin/">運営</a></nav></header>
<main class="extension-shell"><div class="extension-toolbar"><div><h1>拡張機能</h1><p class="muted">Chromeの拡張機能画面のように、MixAll +へ追加された機能を検索・実行できます。</p></div><input id="search" type="search" placeholder="拡張機能を検索"></div><div class="extension-note">拡張機能は運営が登録したサンドボックス内のプログラムです。停止された拡張機能は一覧から消え、実行中の画面を閉じると終了します。</div><section id="list" class="extension-grid"><p class="muted">読み込み中...</p></section></main><div id="modal" class="extension-modal" hidden><header><strong id="modalTitle">拡張機能</strong><button id="close" type="button" class="ghost">閉じる</button></header><iframe id="runner" title="拡張機能実行画面" sandbox="allow-scripts" allow="camera; microphone"></iframe></div>
<script>
const session=Netrify.requireLogin(); let rows=[]; const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,token:session.token})});const d=await r.json();if(!r.ok)throw new Error(d.error||`エラー(${r.status})`);return d;}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const el=document.getElementById('list');const filtered=rows.filter(x=>!q||[x.name,x.description,x.author].join(' ').toLowerCase().includes(q));el.innerHTML=filtered.map(x=>`<article class="extension-card"><div class="extension-head"><div class="extension-icon">${esc(x.icon||'🧩')}</div><div><h2>${esc(x.name)}</h2><div class="extension-meta">バージョン ${esc(x.version)} · ${esc(x.author||'運営')}</div></div></div><p>${esc(x.description||'説明はありません。')}</p><div class="extension-meta">権限: ${x.permissions?.length?x.permissions.map(esc).join(', '):'なし'}</div><div class="extension-actions"><button type="button" data-run="${esc(x.id)}">実行</button><button type="button" class="ghost" data-download="${esc(x.id)}">ダウンロード</button></div></article>`).join('')||'<p class="muted">該当する拡張機能がありません。</p>';el.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>run(b.dataset.run));el.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(b.dataset.download));}
async function load(){try{const d=await fetch('/.netlify/functions/extensions?token='+encodeURIComponent(session.token)).then(r=>r.json());if(!d.extensions)throw new Error(d.error||'取得失敗');rows=d.extensions;render();}catch(e){document.getElementById('list').innerHTML=`<p class="error">${esc(e.message)}</p>`;}}
async function getPackage(id){const d=await fetch('/.netlify/functions/extensions?id='+encodeURIComponent(id)+'&token='+encodeURIComponent(session.token)).then(r=>r.json());if(!d.extension)throw new Error(d.error||'パッケージ取得失敗');return d.extension;}
async function download(id){try{const x=await getPackage(id);const blob=new Blob([JSON.stringify({manifest:x.manifest,meta:{id:x.id,name:x.name,version:x.version,description:x.description,author:x.author,icon:x.icon,permissions:x.permissions},bundle:x.bundle},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mixall-extension-${x.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}catch(e){alert(e.message);}}
async function run(id){try{const x=await getPackage(id);document.getElementById('modalTitle').textContent=`${x.icon||'🧩'} ${x.name} v${x.version}`;const iframe=document.getElementById('runner');const safeBundle=x.bundle.replace(/<\/script/gi,'<\\/script');iframe.srcdoc=`<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#fff;color:#151923}button,input,textarea{font:inherit;padding:8px;margin:4px 0}button{cursor:pointer}</style></head><body><div id="app"></div><script>const extensionId=${JSON.stringify(x.id)};window.MixAllExtension={id:extensionId,api:(action,payload={})=>new Promise((resolve,reject)=>{const requestId=Math.random().toString(36).slice(2);function handler(e){if(e.source!==parent||e.data?.requestId!==requestId)return;removeEventListener('message',handler);e.data.error?reject(new Error(e.data.error)):resolve(e.data.result)}addEventListener('message',handler);parent.postMessage({type:'mixall-extension-api',requestId,extensionId,action,payload},'*')})};try{${safeBundle}}catch(e){document.body.insertAdjacentHTML('beforeend','<pre style="color:#b00">'+String(e.stack||e)+'</pre>')}${'</scr'+'ipt>'}</body></html>`;document.getElementById('modal').hidden=false;}catch(e){alert(e.message);}}
window.addEventListener('message',async(e)=>{if(e.data?.type!=='mixall-extension-api')return;try{const result=await api('/.netlify/functions/extensions',{action:e.data.action,extensionId:e.data.extensionId,...(e.data.payload||{})});e.source.postMessage({requestId:e.data.requestId,result},'*');}catch(err){e.source.postMessage({requestId:e.data.requestId,error:err.message},'*');}});document.getElementById('close').onclick=()=>{document.getElementById('runner').srcdoc='';document.getElementById('modal').hidden=true};document.getElementById('search').oninput=render;load();
</script><script src="/js/mixall-nav.js"></script></body></html>
