</head><body><header class="top"><div class="brand"><a href="/Ghost" style="color:inherit"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/Ghost">Ghost</a><a href="/Ghost/search.html">検索</a><a href="/">トップへ</a></nav></header><main><div class="card"><h2>Ghostチャット</h2><p class="muted">Pocketとは別のGhost専用DMです。相手のメールアドレスは表示しません。</p><div class="row"><input id="to" placeholder="相手のGhost ID（@name）" style="flex:1"><button id="open">開く</button></div></div><div class="card" id="messages"><p class="muted">相手のGhost IDを入力してください。</p></div><div class="card"><textarea id="text" placeholder="メッセージ"></textarea><button id="send">送信</button><div id="error" class="error"></div></div></main><script src="/js/auth.js"></script><script>const session=Netrify.requireLogin();let roomId=new URLSearchParams(location.search).get('roomId');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){if(!roomId)return;const r=await fetch('/.netlify/functions/ghost-chat?roomId='+encodeURIComponent(roomId)+'&token='+encodeURIComponent(session.token));const d=await r.json();if(!r.ok){document.getElementById('error').textContent=d.error;return;}document.getElementById('messages').innerHTML=d.room.messages.map(m=>'<div class="admin-item"><p class="ghost-text-content">'+(window.NetrifyLanguage ? NetrifyLanguage.renderText(m.text) : esc(m.text))+'</p><small class="muted">'+new Date(m.createdAt).toLocaleString('ja-JP')+'</small></div>').join('')||'<p class="muted">まだメッセージがありません。</p>';const el=document.getElementById('messages');el.scrollTop=el.scrollHeight;}document.getElementById('open').onclick=async()=>{const to=document.getElementById('to').value.trim();if(!to)return;const r=await Netrify.api('/.netlify/functions/ghost-chat',{action:'send',token:session.token,toHandle:to,text:'（Ghostチャットを開始しました）'});roomId=r.room.id;history.replaceState({},'', '?roomId='+encodeURIComponent(roomId));await load();};document.getElementById('send').onclick=async()=>{const text=document.getElementById('text').value.trim();if(!text||!roomId)return;try{await Netrify.api('/.netlify/functions/ghost-chat',{action:'send',token:session.token,roomId,text});document.getElementById('text').value='';await load();}catch(e){document.getElementById('error').textContent=e.message;}};load();setInterval(load,5000);</script><script src="/js/ghost-nav.js"></script>
</body></html>
