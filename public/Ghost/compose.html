<head>
  <meta charset="UTF-8">

  <script src="/js/settings.js"></script>
  <script src="/js/site-lock.js" defer></script>
  <script src="/js/mixall-nav.js" defer></script>
  <style>
    .gc-types { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .gc-types button { border-radius: 999px !important; }
    .gc-types button[aria-pressed="true"] { color: #fff !important; background: var(--mx-grad) !important; border-color: transparent !important; }
    .gc-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin: 8px 0; }
    .gc-media figure { position: relative; margin: 0; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--panel-2); }
    .gc-media img { width: 100%; height: 100%; object-fit: cover; }
    .gc-media button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; min-height: 0 !important; padding: 0 !important; border-radius: 50% !important; background: rgba(0,0,0,.6) !important; color: #fff !important; border: 0 !important; box-shadow: none !important; }
    .gc-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .gc-section { margin-top: 12px; padding: 12px; border-radius: 14px; border: 1px dashed color-mix(in srgb, #8b6bff 45%, var(--border)); background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
    .gc-section[hidden] { display: none; }
    .gc-opt { display: flex; gap: 6px; }
    .gc-opt input { margin-bottom: 6px !important; }
    .gc-count { margin-left: auto; font-size: .8rem; color: var(--text-dim); }
    .gc-sched-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .gc-sched-item:last-child { border-bottom: 0; }
    .gc-sched-item .when { font-weight: 800; white-space: nowrap; }
    .gc-sched-item .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); }
  </style>
</head>
<body>
<header class="top"><div class="brand"><a href="/Ghost" style="color:inherit"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div>
  <nav class="services"><a href="/Ghost">ホーム</a><a href="/Ghost/compose.html">投稿</a><a href="/Ghost/watch.html">動画</a><a href="/Ghost/search.html">検索</a><a href="/Ghost/notifications.html">通知</a><a href="/">トップへ</a></nav></header>
<main>
  <form class="card" id="composeForm">
    <h2 style="margin-top:0">投稿する</h2>
    <div class="gc-types" role="group" aria-label="投稿の種類">
      <button type="button" class="secondary" data-type="text" aria-pressed="true">テキスト</button>
      <button type="button" class="secondary" data-type="photo" aria-pressed="false">写真</button>
      <button type="button" class="secondary" data-type="illustration" aria-pressed="false">イラスト・作品</button>
      <button type="button" class="secondary" data-type="video" aria-pressed="false">動画</button>
      <button type="button" class="secondary" data-type="short" aria-pressed="false">ショート</button>
    </div>
    <input type="text" id="title" placeholder="タイトル（動画は必須）" maxlength="160">
    <textarea id="text" rows="5" placeholder="いまどうしてる？" maxlength="5000"></textarea>
    <div class="gc-media" id="mediaPreview"></div>
    <input type="url" id="videoUrl" placeholder="動画のURL（YouTube など・任意）">
    <input type="text" id="tags" placeholder="タグ（カンマ区切り・例: 写真, 旅行）">
    <div class="gc-tools">
      <label class="button secondary" style="cursor:pointer">🖼 画像を追加<input type="file" id="imageInput" accept="image/*" multiple hidden></label>
      <button type="button" class="secondary" id="pollToggle">📊 投票を付ける</button>
      <button type="button" class="secondary" id="schedToggle">⏰ 予約投稿</button>
      <span class="gc-count" id="count">0 / 5000</span>
    </div>
    <div class="gc-section" id="pollBox" hidden>
      <strong>投票</strong>
      <input type="text" id="pollQ" placeholder="質問（任意）" maxlength="120" style="margin-top:8px">
      <div id="pollOpts"></div>
      <div class="row"><button type="button" class="ghost" id="pollAdd">＋ 選択肢を追加</button>
        <select id="pollHours" style="width:auto;margin:0"><option value="1">1時間</option><option value="24" selected>1日</option><option value="72">3日</option><option value="168">1週間</option></select></div>
    </div>
    <div class="gc-section" id="schedBox" hidden>
      <strong>予約投稿</strong>
      <p class="muted" style="margin:6px 0">指定した日時に自動で公開します（1分後〜30日後）。</p>
      <input type="datetime-local" id="schedAt">
    </div>
    <div class="row" style="margin-top:14px"><button type="submit" id="submitBtn">投稿する</button><a class="button secondary" href="/Ghost">キャンセル</a></div>
  </form>
  <section class="card" id="schedList" hidden><h3 style="margin-top:0">予約中の投稿</h3><div id="schedItems"></div></section>
</main>
<script src="/js/auth.js"></script>
<script>
(function () {
  const s = Netrify.requireLogin();
  if (!s) return;
  const $ = (id) => document.getElementById(id);
  const esc = (x) => String(x ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let type = 'text'; const images = [];
  document.querySelectorAll('[data-type]').forEach((b) => { b.onclick = () => { type = b.dataset.type; document.querySelectorAll('[data-type]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; });
  $('text').addEventListener('input', () => { $('count').textContent = `${$('text').value.length} / 5000`; });

  // 画像: 長い辺を1600pxに縮めてから添付（最大6枚）
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src); resolve(c.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = () => reject(new Error('画像を読み込めませんでした'));
      img.src = URL.createObjectURL(file);
    });
  }
  function drawImages() {
    $('mediaPreview').innerHTML = images.map((src, i) => `<figure><img src="${src}" alt=""><button type="button" data-rm="${i}" aria-label="画像を外す">×</button></figure>`).join('');
    $('mediaPreview').querySelectorAll('[data-rm]').forEach((b) => { b.onclick = () => { images.splice(Number(b.dataset.rm), 1); drawImages(); }; });
  }
  $('imageInput').onchange = async (e) => {
    for (const f of [...e.target.files]) {
      if (images.length >= 6) { alert('画像は6枚までです'); break; }
      try { images.push(await shrink(f)); } catch (err) { alert(err.message); }
    }
    e.target.value = ''; drawImages();
    if (images.length && type === 'text') document.querySelector('[data-type="photo"]').click();
  };

  // 投票
  function addOpt(v = '') {
    if ($('pollOpts').children.length >= 4) return;
    const row = document.createElement('div'); row.className = 'gc-opt';
    row.innerHTML = `<input type="text" maxlength="60" placeholder="選択肢 ${$('pollOpts').children.length + 1}" value="${esc(v)}">`;
    $('pollOpts').appendChild(row);
  }
  $('pollToggle').onclick = () => { const box = $('pollBox'); box.hidden = !box.hidden; if (!box.hidden && !$('pollOpts').children.length) { addOpt(); addOpt(); } $('pollToggle').setAttribute('aria-pressed', String(!box.hidden)); };
  $('pollAdd').onclick = () => addOpt();
  function pollData() {
    if ($('pollBox').hidden) return null;
    const options = [...$('pollOpts').querySelectorAll('input')].map((i) => i.value.trim()).filter(Boolean);
    if (options.length < 2) throw new Error('投票の選択肢を2つ以上入れてください');
    return { question: $('pollQ').value.trim(), options, hours: Number($('pollHours').value) };
  }

  // 予約投稿
  $('schedToggle').onclick = () => {
    const box = $('schedBox'); box.hidden = !box.hidden;
    if (!box.hidden && !$('schedAt').value) { const d = new Date(Date.now() + 60 * 60 * 1000); d.setMinutes(0, 0, 0); $('schedAt').value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
    $('submitBtn').textContent = box.hidden ? '投稿する' : '予約する';
    $('schedToggle').setAttribute('aria-pressed', String(!box.hidden));
  };
  async function loadScheduled() {
    try {
      const d = await MixAllPlus.api('scheduledPosts', {}, 'GET');
      $('schedList').hidden = !d.items.length;
      $('schedItems').innerHTML = d.items.map((it) => `<div class="gc-sched-item"><span class="when">${new Date(it.at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span><span class="what">${esc(it.title || it.text || '（画像のみ）')}${it.media ? ` 🖼${it.media}` : ''}${it.poll ? ' 📊' : ''}</span><button type="button" class="ghost" data-cancel="${esc(it.id)}">取り消す</button></div>`).join('');
      $('schedItems').querySelectorAll('[data-cancel]').forEach((b) => { b.onclick = async () => { if (!(await MixAllDialog.confirm('この予約投稿を取り消しますか？'))) return; await MixAllPlus.api('cancelScheduled', { id: b.dataset.cancel }); loadScheduled(); }; });
    } catch (_) { /* ignore */ }
  }

  $('composeForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('submitBtn');
    try {
      const poll = pollData();
      const media = images.map((dataUrl) => ({ kind: 'image', dataUrl }));
      const url = $('videoUrl').value.trim(); if (url) media.push({ kind: 'videoUrl', url });
      const post = { text: $('text').value.trim(), title: $('title').value.trim(), contentType: type, tags: $('tags').value, media, displayName: s.displayName };
      if (!post.text && !media.length) throw new Error('本文か画像を入れてください');
      btn.disabled = true;
      if (!$('schedBox').hidden) {
        const at = new Date($('schedAt').value).getTime();
        await MixAllPlus.api('schedulePost', { at, post, poll });
        MixAllUX.toast(`${new Date(at).toLocaleString('ja-JP')} に公開されるよう予約しました`);
        $('composeForm').reset(); images.length = 0; drawImages(); $('schedBox').hidden = true; $('pollBox').hidden = true; $('submitBtn').textContent = '投稿する';
        loadScheduled();
        return;
      }
      const res = await Netrify.api('/.netlify/functions/ghost', { action: 'createPost', token: s.token, ...post });
      if (poll && res.post) await MixAllPlus.api('createPoll', { postId: res.post.id, poll });
      MixAllUX.toast('投稿しました');
      location.href = '/Ghost';
    } catch (err) { alert(err.message); }
    finally { btn.disabled = false; }
  };
  const start = () => loadScheduled();
  if (window.MixAllPlus) start(); else window.addEventListener('load', start);
})();
</script>
<script src="/js/ghost-nav.js"></script>
</body>
</html>
