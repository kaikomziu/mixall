<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
main{max-width:1000px}.live-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:14px}.live-player{width:100%;aspect-ratio:16/9;background:#050505;border-radius:12px;object-fit:contain}.live-status{font-weight:700}.live-dot{color:#ef4444}.live-chat{height:min(55vh,520px);overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px}.live-message{padding:7px 2px;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.live-message small{color:var(--text-dim)}.live-compose{display:flex;gap:7px;margin-top:8px}.live-compose input{flex:1;min-width:0}.live-note{font-size:.85rem}.live-card{margin:10px 0}.archived-comments{border-top:1px solid var(--border);margin-top:14px;padding-top:10px}.archive-comment{padding:8px 0;border-bottom:1px solid var(--border)}.archive-comment small{color:var(--text-dim)}@media(max-width:760px){.live-layout{grid-template-columns:1fr}.live-chat{height:38vh}}
</style>

<body>
<header class="top"><div class="brand"><a href="/Ghost" style="color:inherit"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/Ghost">Ghost</a><a href="/Ghost/watch.html">動画</a><a href="/Ghost/live.html" class="active">ライブ</a><a href="/">トップへ</a></nav></header>
<main><div id="liveRoot" class="card"><p class="muted">読み込み中...</p></div></main>
<script>
const session=Netrify.requireLogin();
const postId=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.getElementById('liveRoot');
let livePost=null, lastChatAt='', liveTimer=null, peerTimer=null, viewerKeepAlive=null, hostStream=null, recorder=null, archiveChain=Promise.resolve(), archiveError=null, archiveIndex=0, archiveSize=0, archiveParts=[], archivePartsSize=0, archiveFileId='', archiveMime='video/webm';
const chatIds=new Set(), peers=new Map(), iceConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function waitIce(pc){if(pc.iceGatheringState==='complete')return Promise.resolve();return new Promise(resolve=>{const timer=setTimeout(done,9000);function done(){clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',check);resolve();}function check(){if(pc.iceGatheringState==='complete')done();}pc.addEventListener('icegatheringstatechange',check);});}
async function api(signalAction,extra={}){return Netrify.api('/.netlify/functions/ghost',{action:'liveSignal',token:session.token,postId:livePost.id,signalAction,...extra});}
function addChat(comments){const box=document.getElementById('liveChat');if(!box)return;for(const c of comments||[]){if(chatIds.has(c.id))continue;chatIds.add(c.id);lastChatAt=(!lastChatAt||c.createdAt>lastChatAt)?c.createdAt:lastChatAt;const row=document.createElement('div');row.className='live-message';row.innerHTML=`<small>${esc(c.authorProfile?.displayName||c.authorName||'ユーザー')} · ${new Date(c.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small><div>${window.NetrifyLanguage?NetrifyLanguage.renderText(c.text||''):esc(c.text||'')}</div>`;box.appendChild(row);}box.scrollTop=box.scrollHeight;}
async function pollChat(){try{const url='/.netlify/functions/ghost?liveChat='+encodeURIComponent(livePost.id)+(lastChatAt?'&after='+encodeURIComponent(lastChatAt):'')+(session?'&token='+encodeURIComponent(session.token):'');const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.error||'チャットを取得できません');addChat(d.comments);if(!d.live){clearInterval(liveTimer);await loadArchive();}}catch(e){const el=document.getElementById('liveError');if(el)el.textContent=e.message;}}
function showLiveShell(isHost){root.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2 id="liveTitle">${esc(livePost.title||'Ghostライブ')}</h2><div class="muted">${esc(livePost.authorProfile?.displayName||livePost.authorName||'配信者')} · <span class="live-status"><span class="live-dot">●</span> LIVE</span> · <span id="viewerCount">視聴者数: 0</span></div></div><a class="ghost" href="/Ghost/watch.html">動画一覧</a></div><p class="ghost-text-content">${window.NetrifyLanguage?NetrifyLanguage.renderText(livePost.description||''):esc(livePost.description||'')}</p><div class="live-layout"><section><video id="liveVideo" class="live-player" autoplay playsinline ${isHost?'muted':''} controls></video><p id="liveStatus" class="muted">${isHost?'カメラを準備しています...':'配信に接続しています...'} <span id="liveQuality">接続品質: checking</span></p>${isHost?'<button type="button" id="endLiveButton" class="secondary">配信を終了してアーカイブを保存</button><p class="live-note muted">このページを開いたままにしてください。配信者のアップロード帯域を視聴者数分使用します。接続情報は一時的なNetlify Blobで交換し、映像・音声はWebRTCで配信します。現在は最大12人です。</p>':''}<p id="liveError" class="error"></p></section><section><h3 style="margin-top:0">リアルタイムチャット</h3><div id="liveChat" class="live-chat" aria-live="polite"></div>${session?'<div class="live-compose"><input id="liveChatInput" maxlength="500" placeholder="ライブチャット"><button type="button" class="secondary" id="liveChatSend">送信</button></div>':'<p class="muted">チャット送信にはログインが必要です。</p>'}</section></div>`;
if(session){document.getElementById('liveChatSend').onclick=sendLiveComment;document.getElementById('liveChatInput').onkeydown=e=>{if(e.key==='Enter')sendLiveComment();};}if(isHost)document.getElementById('endLiveButton').onclick=endLive;
}
async function sendLiveComment(){const input=document.getElementById('liveChatInput'),text=input.value.trim();if(!text)return;const button=document.getElementById('liveChatSend');button.disabled=true;try{await Netrify.api('/.netlify/functions/ghost',{action:'liveComment',token:session.token,postId:livePost.id,text});input.value='';await pollChat();}catch(e){document.getElementById('liveError').textContent=e.message;}finally{button.disabled=false;}}
async function startArchiveRecorder(stream){
 const types=['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm','video/mp4'];archiveMime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';if(!archiveMime)throw new Error('このブラウザーはアーカイブ可能な録画形式に対応していません');
 archiveFileId=crypto.randomUUID().replace(/-/g,'');recorder=new MediaRecorder(stream,{mimeType:archiveMime,videoBitsPerSecond:900000,audioBitsPerSecond:96000});recorder.ondataavailable=e=>{if(e.data?.size)queueArchiveData(e.data);};recorder.onerror=()=>{archiveError=new Error('録画中にエラーが発生しました');};recorder.start(1200);
}
const ARCHIVE_CHUNK_BYTES=512*1024;
function queueArchiveData(blob){archiveChain=archiveChain.then(async()=>{archiveParts.push(blob);archivePartsSize+=blob.size;while(archivePartsSize>=ARCHIVE_CHUNK_BYTES){const merged=new Blob(archiveParts,{type:archiveMime});const chunk=merged.slice(0,ARCHIVE_CHUNK_BYTES);const rest=merged.slice(ARCHIVE_CHUNK_BYTES);archiveParts=rest.size?[rest]:[];archivePartsSize=rest.size;await uploadArchiveChunk(chunk);}}).catch(err=>{archiveError=err;const s=document.getElementById('liveStatus');if(s)s.textContent='アーカイブの保存に失敗: '+err.message;});}
async function uploadArchiveChunk(blob,finalChunk=false){const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('録画チャンクを読み込めません'));reader.readAsDataURL(blob);});let failure;for(let attempt=1;attempt<=3;attempt++){try{await Netrify.api('/.netlify/functions/ghost',{action:'uploadLiveArchiveChunk',token:session.token,postId:livePost.id,fileId:archiveFileId,index:archiveIndex,data:dataUrl,mimeType:archiveMime.split(';')[0],chunkBytes:ARCHIVE_CHUNK_BYTES,finalChunk});archiveIndex++;archiveSize+=blob.size;return;}catch(e){failure=e;await new Promise(r=>setTimeout(r,500*attempt));}}throw failure||new Error('アーカイブの保存に失敗しました');}
async function startBroadcast(){const status=document.getElementById('liveStatus');try{if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection||!window.MediaRecorder)throw new Error('このブラウザーはライブ配信に必要なカメラ／WebRTC機能に対応していません');try{hostStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24,max:30}},audio:true});}catch(_){hostStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24,max:30}},audio:false});status.textContent='マイクなしで映像のみ配信します。';}document.getElementById('liveVideo').srcObject=hostStream;await startArchiveRecorder(hostStream);status.textContent='配信中です。視聴者が接続できます。';peerTimer=setInterval(pollOffers,1200);}catch(e){status.textContent='配信を開始できません';document.getElementById('liveError').textContent=e.message;}}
async function pollOffers(){try{const result=await api('offers');for(const entry of result.peers||[]){if(peers.has(entry.peerId))continue;const pc=new RTCPeerConnection(iceConfig);peers.set(entry.peerId,pc); const count=document.getElementById('viewerCount'); if(count) count.textContent=`視聴者数: ${result.viewerCount||result.peers?.length||0}`;for(const track of hostStream.getTracks())pc.addTrack(track,hostStream);pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)){pc.close();peers.delete(entry.peerId);}};try{await pc.setRemoteDescription(entry.offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await waitIce(pc);await api('answer',{peerId:entry.peerId,description:pc.localDescription});}catch(e){pc.close();peers.delete(entry.peerId);console.warn('live peer error',e);}}}catch(e){const error=document.getElementById('liveError');if(error)error.textContent=e.message;}}
async function startViewer(){const status=document.getElementById('liveStatus');try{if(!session)throw new Error('ライブを視聴するにはログインしてください');if(!window.RTCPeerConnection)throw new Error('このブラウザーはWebRTCに対応していません');const {peerId}=await api('join');const pc=new RTCPeerConnection(iceConfig);peers.set(peerId,pc);pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});pc.ontrack=e=>{const video=document.getElementById('liveVideo');video.srcObject=e.streams[0];video.play().catch(()=>{status.textContent='再生ボタンを押して視聴してください';});status.textContent='ライブ配信に接続しました';};pc.onconnectionstatechange=()=>{ const quality=document.getElementById('liveQuality'); if(quality) quality.textContent=`接続品質: ${pc.connectionState}`; if(pc.connectionState==='failed'){status.textContent='接続できません。視聴者が多い場合やネットワーク設定により接続できないことがあります。';clearInterval(viewerKeepAlive);api('leave',{peerId}).catch(()=>{});}};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);await api('offer',{peerId,description:pc.localDescription});status.textContent='配信者からの映像を待っています...';const started=Date.now();const poller=setInterval(async()=>{try{const state=await api('poll',{peerId});if(state.answer){clearInterval(poller);await pc.setRemoteDescription(state.answer);viewerKeepAlive=setInterval(()=>api('poll',{peerId}).catch(()=>{}),25000);status.textContent='映像を受信しています...';}else if(Date.now()-started>45000){clearInterval(poller);status.textContent='接続待ちがタイムアウトしました。ページを再読み込みしてください。';}}catch(e){clearInterval(poller);status.textContent=e.message;}},900);}catch(e){status.textContent=e.message;}}
function commentMarkup(c){return `<div class="archive-comment"><small>${esc(c.authorProfile?.displayName||c.authorName||'ユーザー')} · ${new Date(c.createdAt).toLocaleString('ja-JP')}${c.isLiveChat?' · ライブチャット':''}</small><div>${window.NetrifyLanguage?NetrifyLanguage.renderText(c.text||''):esc(c.text||'')}</div></div>`;}
async function loadArchive(){clearInterval(liveTimer);clearInterval(peerTimer);clearInterval(viewerKeepAlive);for(const pc of peers.values())pc.close();peers.clear();const r=await fetch('/.netlify/functions/ghost?post='+encodeURIComponent(livePost.id)+(session?'&token='+encodeURIComponent(session.token):''));const d=await r.json();if(!r.ok)throw new Error(d.error||'アーカイブを読み込めません');livePost=d.post;const media=(livePost.media||[]).find(m=>m.kind==='videoBlob'||m.kind==='videoUrl'||m.kind==='videoFile');const src=media?.mediaUrl||media?.url||media?.dataUrl||'';root.innerHTML=`<h2>${esc(livePost.title||'ライブアーカイブ')}</h2><div class="muted">${esc(livePost.authorProfile?.displayName||livePost.authorName||'配信者')} · 配信終了 ${livePost.liveEndedAt?new Date(livePost.liveEndedAt).toLocaleString('ja-JP'):''}</div><p class="ghost-text-content">${window.NetrifyLanguage?NetrifyLanguage.renderText(livePost.description||''):esc(livePost.description||'')}</p>${src?`<video class="live-player" src="${esc(src)}" controls playsinline preload="metadata"></video>`:'<p class="error">アーカイブ動画を読み込めませんでした。</p>'}<section class="archived-comments"><h3>コメント（ライブチャット履歴を含む）</h3><div id="archiveComments">${(livePost.comments||[]).map(commentMarkup).join('')||'<p class="muted">まだコメントがありません。</p>'}</div>${session?'<div class="live-compose"><input id="archiveCommentInput" placeholder="コメントする"><button type="button" class="secondary" id="archiveCommentSend">送信</button></div>':''}</section><p><a href="/Ghost/watch.html">動画一覧へ</a></p>`;if(session)document.getElementById('archiveCommentSend').onclick=sendArchiveComment;}
async function sendArchiveComment(){const input=document.getElementById('archiveCommentInput');if(!input.value.trim())return;try{await Netrify.api('/.netlify/functions/ghost',{action:'addComment',token:session.token,postId:livePost.id,text:input.value.trim()});await loadArchive();}catch(e){alert(e.message);}}
async function endLive(){const button=document.getElementById('endLiveButton');button.disabled=true;const status=document.getElementById('liveStatus');status.textContent='録画を確定してコメントをアーカイブしています...';clearInterval(peerTimer);try{if(recorder&&recorder.state!=='inactive'){await new Promise(resolve=>{recorder.addEventListener('stop',resolve,{once:true});recorder.stop();});}await archiveChain;if(archiveError)throw archiveError;const merged=new Blob(archiveParts,{type:archiveMime});if(merged.size){await uploadArchiveChunk(merged,true);archiveParts=[];archivePartsSize=0;}if(!archiveIndex||!archiveSize)throw new Error('録画データがありません。数秒配信してから終了してください');await Netrify.api('/.netlify/functions/ghost',{action:'endLive',token:session.token,postId:livePost.id,fileId:archiveFileId,sizeBytes:archiveSize,fileName:(livePost.title||'Ghost-live').replace(/[\\/:*?"<>|]/g,'_')+(archiveMime.startsWith('video/mp4')?'.mp4':'.webm')});if(hostStream)hostStream.getTracks().forEach(track=>track.stop());for(const [peerId,pc] of peers){pc.close();api('leave',{peerId}).catch(()=>{});}await loadArchive();}catch(e){status.textContent='配信をまだ終了できませんでした';document.getElementById('liveError').textContent=e.message;button.disabled=false;}}
async function renderDirectory(){document.title='Ghostライブ一覧 - MixAll +';const r=await fetch('/.netlify/functions/ghost?type=live&limit=100&token='+encodeURIComponent(session.token));const d=await r.json();const posts=(d.posts||[]).filter(p=>p.isLive);root.innerHTML='<h2>Ghostライブ配信</h2><p class="muted">配信中のライブを視聴できます。</p><p><a class="secondary" href="/Ghost/?compose=1">ライブ配信を始める</a></p>'+(posts.map(p=>`<article class="card live-card"><strong><span class="live-dot">● LIVE</span> ${esc(p.title||'Ghostライブ')}</strong><p>${esc(p.authorProfile?.displayName||p.authorName||'配信者')}</p><p>${esc(p.description||'')}</p><a class="secondary" href="/Ghost/live.html?id=${encodeURIComponent(p.id)}">ライブを視聴・チャット</a></article>`).join('')||'<p class="muted">現在ライブ配信はありません。</p>');}
async function loadLive(){if(!postId){await renderDirectory();return;}const r=await fetch('/.netlify/functions/ghost?post='+encodeURIComponent(postId)+(session?'&token='+encodeURIComponent(session.token):''));const d=await r.json();if(!r.ok)throw new Error(d.error||'配信を読み込めません');livePost=d.post;document.title=(livePost.title||'Ghostライブ')+' - MixAll +';if(livePost.isLive&&livePost.contentType==='live'){const isHost=Boolean(session&&session.email===livePost.authorEmail);showLiveShell(isHost);await pollChat();liveTimer=setInterval(pollChat,1200);if(isHost)await startBroadcast();else await startViewer();}else await loadArchive();}
window.addEventListener('beforeunload',()=>{clearInterval(liveTimer);clearInterval(peerTimer);clearInterval(viewerKeepAlive);if(hostStream)hostStream.getTracks().forEach(track=>track.stop());for(const pc of peers.values())pc.close();});
loadLive().catch(e=>{root.innerHTML=`<p class="error">${esc(e.message)}</p><p><a href="/Ghost/live.html">ライブ一覧へ</a></p>`;});
</script><script src="/js/ghost-nav.js"></script>
</body></html>
