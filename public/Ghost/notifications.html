</head><body><header class="top"><div class="brand"><a href="/Ghost" style="color:inherit">Mix<span>All</span></a></div><nav class="services"><a href="/Ghost">Ghost</a><a href="/Ghost/notifications.html" class="active">通知</a></nav></header><main><div class="card"><h2>通知</h2><div id="list"><p class="muted">読み込み中...</p></div></div></main><script src="/js/auth.js"></script><script>const s=Netrify.requireLogin();function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}const ICON={like:'♥',comment:'💬',reply:'↩',commentDeleted:'🗑'};const LABEL={like:'いいね',comment:'コメント',reply:'返信',commentDeleted:'コメント削除'};
function targetOf(n){if(!n.postId)return '';const id=encodeURIComponent(n.postId);const c=n.commentId?'&c='+encodeURIComponent(n.commentId):'';if(n.contentType==='short')return '/Ghost/videos.html?v='+id+c;if(n.contentType==='video'||n.contentType==='live')return '/Ghost/watch.html?v='+id+c;return '/Ghost/post.html?id='+id+c;}
async function load(){if(!s)return;const r=await fetch('/api/ghost?notifications=1&token='+encodeURIComponent(s.token));const d=await r.json();document.getElementById('list').innerHTML=(d.notifications||[]).map(n=>{const target=targetOf(n);const body='<p><strong>'+(ICON[n.type]||'🔔')+' '+esc(LABEL[n.type]||'通知')+'</strong><br>'+esc(n.text)+'</p>'+(n.snippet?'<p class="muted ghost-text-content" style="margin:4px 0">「'+esc(n.snippet)+'」</p>':'')+'<small class="muted">'+new Date(n.createdAt).toLocaleString('ja-JP')+'</small>';return target?'<a class="admin-item notification-link" href="'+target+'" aria-label="通知の投稿を開く">'+body+'</a>':'<div class="admin-item">'+body+'</div>';}).join('')||'<p class="muted">新しい通知はありません。</p>';}load();setInterval(load,10000);</script><script src="/js/ghost-nav.js"></script>
</body></html>
