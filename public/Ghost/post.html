</head><body><header class="top"><div class="brand"><a href="/Ghost" style="color:inherit"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/Ghost">Ghost</a><a href="/Ghost/search.html">検索</a><a href="/">トップへ</a></nav></header><main><div id="post" class="card"><p class="muted">読み込み中...</p></div></main><script src="/js/auth.js"></script><script>const id=new URLSearchParams(location.search).get('id')||location.pathname.split('/').pop();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function yt(u){const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([\w-]+)/);return m?'https://www.youtube.com/embed/'+m[1]:'';}function mediaHtml(media){return (media||[]).map(m=>(m.kind==='image'||m.kind==='imageBlob')?'<img src="'+(m.mediaUrl||m.dataUrl)+'" alt="" style="max-width:100%;border-radius:8px">':m.kind==='videoFile'?'<video src="'+m.dataUrl+'" controls playsinline style="width:100%;max-height:70vh"></video>':m.kind==='videoBlob'?'<video src="'+m.mediaUrl+'" controls playsinline style="width:100%;max-height:70vh"></video>':(yt(m.url)?'<iframe src="'+yt(m.url)+'" style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px" allowfullscreen></iframe>':'<video src="'+esc(m.url)+'" controls playsinline style="width:100%;max-height:70vh"></video>')).join('');}async function load(){const s=Netrify.requireLogin();const r=await fetch('/.netlify/functions/ghost?post='+encodeURIComponent(id)+(s?'&token='+encodeURIComponent(s.token):''));const d=await r.json();if(!r.ok){document.getElementById('post').innerHTML='<p class="error">'+esc(d.error||'投稿が見つかりません')+'</p>';return;}const p=d.post;if(p.isLive){location.replace('/Ghost/live.html?id='+encodeURIComponent(p.id));return;}document.title=(p.authorProfile?.handle?'@'+p.authorProfile.handle+'の投稿':'Ghost投稿');document.getElementById('post').innerHTML='<p><a href="/Ghost/@'+encodeURIComponent(p.authorProfile?.handle||'')+'">'+esc(p.authorProfile?.displayName||p.authorName||'Ghost')+'</a> <span class="muted">'+new Date(p.createdAt).toLocaleString('ja-JP')+'</span></p>'+(p.title?'<h2>'+esc(p.title)+'</h2>':'')+(p.description||p.text?'<p class="ghost-text-content">'+(window.NetrifyLanguage ? NetrifyLanguage.renderText(p.description||p.text) : esc(p.description||p.text))+'</p>':'')+((p.tags||[]).length?'<div class="ghost-tags">'+p.tags.map(t=>'<a href="/Ghost/search.html?q='+encodeURIComponent('#'+t)+'">#'+esc(t)+'</a>').join(' ')+'</div>':'')+mediaHtml(p.media)+'<section class="comments"><h3>コメント</h3>'+((p.comments||[]).map(c=>'<div class="comment-item"><strong>'+esc(c.authorProfile?.displayName||c.authorName||'ユーザー')+'</strong><p class="ghost-text-content">'+(window.NetrifyLanguage ? NetrifyLanguage.renderText(c.text||'') : esc(c.text||''))+'</p></div>').join('')||'<p class="muted">まだコメントがありません。</p>')+'</section><div class="row"><button type="button" class="ghost" id="copy">投稿リンクをコピー</button>'+((()=>{const s=Netrify.getSession();return s&&(s.email===p.authorEmail||s.isAdmin===true)?'<button type="button" class="ghost" id="deletePost">投稿を削除</button>':'';})())+'</div>';document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(location.href).then(()=>document.getElementById('copy').textContent='コピーしました');const del=document.getElementById('deletePost');if(del)del.onclick=async()=>{if(!confirm('この投稿を削除しますか？'))return;try{const s=Netrify.requireLogin();if(!s)return;await Netrify.api('/.netlify/functions/ghost',{action:'deletePost',token:s.token,postId:p.id});location.href='/Ghost';}catch(e){alert('投稿を削除できませんでした: '+e.message);}};}load();</script><script src="/js/ghost-nav.js"></script>
