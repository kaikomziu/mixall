</head><body><header class="top"><div class="brand"><a href="/Ghost" style="color:inherit">Mix<span>All</span></a></div><nav class="services"><a href="/Ghost">Ghost</a><a href="/Ghost/search.html">検索</a><a href="/Ghost/live.html">ライブ</a><a href="/">トップへ</a></nav></header><main><div class="card" id="profile"><p class="muted">読み込み中...</p></div><div class="card"><h3>このユーザーの投稿</h3><div id="posts"><p class="muted">プロフィールを読み込んでいます。</p></div></div></main><script src="/js/auth.js"></script><script src="/js/ghost-profile-img.js"></script><script>const params=(()=>{const p=new URLSearchParams(location.search);if(!p.get('handle')){const m=location.pathname.match(/\/@([^/]+)/);if(m)p.set('handle',decodeURIComponent(m[1]));}return p;})();const handle=params.get('handle')||(params.get('me')==='1'?'me':location.pathname.split('/').pop());const session=Netrify.requireLogin();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){const res=await fetch('/api/ghost?profile='+encodeURIComponent(handle)+(session?'&token='+encodeURIComponent(session.token):''));const data=await res.json();if(!res.ok){document.getElementById('profile').innerHTML='<p class="error">'+esc(data.error||'見つかりません')+'</p>';return;}const p=data.profile;document.title='@'+p.handle+' - Ghost';document.getElementById('profile').innerHTML='<div style="margin:-4px -4px 0;height:140px;border-radius:12px;background:var(--panel-2)'+(p.coverUrl?' url(\''+esc(p.coverUrl)+'\') center/cover no-repeat':'')+'"></div><div style="display:flex;align-items:flex-end;gap:12px;margin-top:-36px;padding-left:12px">'+(p.avatarUrl?'<img src="'+esc(p.avatarUrl)+'" alt="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--bg,#111);background:var(--panel-2)">':'<div style="width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:2rem;border:3px solid var(--bg,#111);background:var(--panel-2)">'+esc((p.displayName||'?').charAt(0))+'</div>')+'</div><h1 style="margin-bottom:4px">'+esc(p.displayName)+'</h1><p class="muted">@'+esc(p.handle)+'</p><p class="ghost-text-content">'+esc(p.bio)+'</p><div class="row"><span>投稿 '+p.postCount+'</span><span>フォロー '+p.followingCount+'</span><span>フォロワー '+p.followersCount+'</span></div>';const posts=await fetch('/api/ghost?authorHandle='+encodeURIComponent(p.handle)+'&limit=100&token='+encodeURIComponent(session.token));const list=await posts.json();const canFollow=session && p.handle && p.handle !== (session.ghostHandle||'');
if(canFollow){const followBtn=document.createElement('button');followBtn.type='button';followBtn.className='ghost';followBtn.dataset.following=String(Boolean(p.following));followBtn.textContent=p.following?'フォロー中':'フォロー';followBtn.onclick=async()=>{const r=await fetch('/api/ghost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'followAccount',token:session.token,targetHandle:p.handle,follow:followBtn.dataset.following!=='true'})});const d=await r.json();if(r.ok){followBtn.dataset.following=String(d.following);followBtn.textContent=d.following?'フォロー中':'フォロー';}};document.getElementById('profile').appendChild(followBtn);}
const copyBtn=document.createElement('button');copyBtn.type='button';copyBtn.className='ghost';copyBtn.textContent='プロフィールリンクをコピー';copyBtn.onclick=()=>navigator.clipboard.writeText(location.origin+'/Ghost/profile.html?handle='+encodeURIComponent(p.handle)).then(()=>copyBtn.textContent='コピーしました');document.getElementById('profile').appendChild(copyBtn);if(session&&((handle==='me')||(session.ghostHandle&&handle===session.ghostHandle))){const editBtn=document.createElement('button');editBtn.type='button';editBtn.className='ghost';editBtn.textContent='プロフィールを編集（アイコン・カバー・名前）';editBtn.onclick=()=>location.href='/Ghost?profileSettings=1';document.getElementById('profile').appendChild(editBtn);}
function postUrl(x){const id=encodeURIComponent(x.id);return x.isLive?'/Ghost/live.html?id='+id:x.contentType==='short'?'/Ghost/videos.html?v='+id:x.contentType==='video'?'/Ghost/watch.html?v='+id:'/Ghost/post.html?id='+id;}
document.getElementById('posts').innerHTML=(list.posts||[]).map(x=>'<article class="card" data-open="'+esc(postUrl(x))+'" style="cursor:pointer"><p class="ghost-text-content">'+esc(x.text||x.description||'')+'</p>'+(x.isLive?'<a class="secondary" href="/Ghost/live.html?id='+encodeURIComponent(x.id)+'">🔴 ライブ配信中 — 視聴</a>':'')+((x.media||[]).map(m=>(m.kind==='image'||m.kind==='imageBlob')?'<img src="'+(m.mediaUrl||m.dataUrl)+'" alt="" style="max-width:100%;border-radius:8px">':m.kind==='videoBlob'?'<video src="'+m.mediaUrl+'" controls playsinline style="width:100%;max-height:70vh"></video>':m.kind==='videoFile'?'<video src="'+m.dataUrl+'" controls playsinline style="width:100%;max-height:70vh"></video>':m.kind==='videoUrl'?'<video src="'+esc(m.url)+'" controls playsinline style="width:100%;max-height:70vh"></video>':'').join(''))+'<a class="secondary" href="'+esc(postUrl(x))+'">投稿を開く</a> <button type="button" class="ghost" data-copy-post="'+esc(x.id)+'">投稿リンクをコピー</button></article>').join('')||'<p class="muted">投稿はありません。</p>';document.querySelectorAll('#posts [data-open]').forEach(card=>card.onclick=(e)=>{if(e.target.closest('button,a,video,iframe'))return;location.href=card.dataset.open;});document.querySelectorAll('[data-copy-post]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(location.origin+'/Ghost/post/'+encodeURIComponent(b.dataset.copyPost)).then(()=>b.textContent='コピーしました'));}load();</script><script src="/js/ghost-nav.js"></script>
