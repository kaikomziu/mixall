<body>
<header class="top">
  <div class="brand"><a href="/" style="color:inherit;">Net<span>rify</span></a></div>
  <nav class="services">
    <a href="/Ghost">Ghost</a>
    <a href="/Pocket">ぽけっと</a>
    <a href="/admin">運営ダッシュボード</a>
  </nav>
</header>

<main>
  <div id="gate" class="card" style="display:none;">
    <h2>アクセスできません</h2>
    <p class="muted">このページは運営または公認アカウントのみ利用できます。</p>
  </div>

  <div id="content" style="display:none;">
    <div class="card">
      <h2>Pocketスタンプ管理へ移動中</h2>
      <p class="muted">Pocketのスタンプ管理画面へ移動しています。</p>
      <input type="text" id="stampName" placeholder="スタンプ名" />
      <input type="file" id="stampFile" accept="image/*" />
      <div id="uploadStatus" class="muted"></div>
      <div class="error" id="createError"></div>
      <button id="createSubmit">スタンプを追加</button>
    </div>

    <div class="card">
      <h2>スタンプ一覧</h2>
      <div id="stampGrid" class="stamp-grid"><p class="muted">読み込み中...</p></div>
    </div>
  </div>
</main>

<script src="/js/auth.js"></script>
<script src="/js/files.js"></script>
<script>
const session = Netrify.requireLogin();

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// このブラウザのタップ済み画像を、ピッカー用の軽量サムネイル(96x96 JPEG)に変換する
function makeThumbnail(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function init() {
  const res = await fetch('/.netlify/functions/stamps?token=' + encodeURIComponent(session.token));
  if (res.status === 401) { window.location.href = '/?next=' + encodeURIComponent(location.pathname); return; }
  const data = await res.json();

  if (!data.canManage) {
    document.getElementById('gate').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';
  renderStamps(data.stamps);
}

async function loadStamps() {
  const res = await fetch('/.netlify/functions/stamps?token=' + encodeURIComponent(session.token));
  const data = await res.json();
  renderStamps(data.stamps);
}

function renderStamps(stamps) {
  const grid = document.getElementById('stampGrid');
  if (!stamps || stamps.length === 0) {
    grid.innerHTML = '<p class="muted">まだスタンプがありません。</p>';
    return;
  }
  grid.innerHTML = stamps.map(s => `
    <div class="stamp-item">
      <img src="${s.thumbnailDataUrl}" alt="${escapeHtml(s.name)}" />
      <div class="name">${escapeHtml(s.name)}</div>
      <button type="button" class="ghost" data-del="${s.id}" style="font-size:0.7rem;padding:2px 6px;">削除</button>
    </div>
  `).join('');
  grid.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('このスタンプを削除しますか?')) return;
      await Netrify.api('/.netlify/functions/stamps', { action: 'deleteStamp', token: session.token, stampId: btn.dataset.del });
      loadStamps();
    };
  });
}

document.getElementById('createSubmit').onclick = async () => {
  const errEl = document.getElementById('createError');
  const statusEl = document.getElementById('uploadStatus');
  errEl.textContent = '';
  const name = document.getElementById('stampName').value.trim();
  const file = document.getElementById('stampFile').files[0];
  if (!name) { errEl.textContent = 'スタンプ名を入力してください'; return; }
  if (!file) { errEl.textContent = '画像を選択してください'; return; }

  try {
    statusEl.textContent = 'サムネイル生成中...';
    const thumbnailDataUrl = await makeThumbnail(file);

    statusEl.textContent = 'アップロード中... (0%)';
    const manifest = await NetrifyFiles.uploadFile(file, session.token, (done, total) => {
      statusEl.textContent = `アップロード中... (${Math.round(done / total * 100)}%)`;
    });

    await Netrify.api('/.netlify/functions/stamps', {
      action: 'createStamp', token: session.token, name, fileId: manifest.fileId, thumbnailDataUrl
    });

    statusEl.textContent = '';
    document.getElementById('stampName').value = '';
    document.getElementById('stampFile').value = '';
    loadStamps();
  } catch (e) {
    statusEl.textContent = '';
    errEl.textContent = e.message;
  }
};

init();
</script>
</body>
</html>
