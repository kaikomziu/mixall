<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghost動画 - MixAll +（二世代）</title><link rel="stylesheet" href="/css/style.css"><script src="/js/settings.js"></script><script src="/js/auth.js"></script><script src="/js/language-input.js"></script><script src="/js/mixall-nav.js" defer></script><style>
.video-card{margin-bottom:18px}.video-player{width:100%;max-height:72vh;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.video-player video,.video-player iframe{width:100%;height:100%;border:0;object-fit:contain}.video-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.video-actions button{padding:7px 11px}.video-comments{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}.video-comment{padding:8px 0;border-bottom:1px solid var(--border)}.video-comment .meta{font-size:.8rem;color:var(--text-dim)}.video-comment-form{display:flex;gap:8px;margin-top:10px}.video-comment-form .language-input-wrap{flex:1;min-width:0;margin:0}.video-comment-form .language-editor{min-height:40px}.video-comment-form button{flex:none}
</style>

</head><body><header class="top"><div class="brand"><a href="/Ghost" style="color:inherit"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/Ghost">通常投稿</a><a href="/Ghost/watch.html" class="active">動画</a><a href="/Ghost/live.html">ライブ</a><a href="/Ghost/videos.html">縦長動画</a></nav></header><main><div class="card"><h2>動画</h2><p class="muted">YouTube風の通常動画フィードです。動画の視聴、いいね、コメント、ブックマークに対応しています。</p></div><div id="feed"><p class="muted">読み込み中...</p></div></main><script>
const session=Netrify.requireLogin();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yt=u=>{const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([\w-]+)/);return m?'https://www.youtube.com/embed/'+m[1]:''};
function renderVideo(m){if(m.kind==='videoFile')return `<video src="${esc(m.dataUrl)}" controls playsinline></video>`;if(m.kind==='videoBlob')return `<video src="${esc(m.mediaUrl)}" controls playsinline></video>`;const embed=yt(m.url);return embed?`<iframe src="${embed}" allowfullscreen></iframe>`:`<video src="${esc(m.url)}" controls playsinline></video>`}
function renderComments(post){if(post.isLive)return '<div class="video-comments"><p class="muted">配信中のコメントはライブチャットに表示されます。</p></div>';const comments=post.comments||[];return `<div class="video-comments" id="comments-${esc(post.id)}" hidden>${comments.map(c=>`<div class="video-comment"><div class="meta">${esc(c.authorProfile?.displayName||c.authorName||'ユーザー')} · ${new Date(c.createdAt).toLocaleString('ja-JP')}</div><div>${NetrifyLanguage.renderText(c.text||'')}</div></div>`).join('')||'<p class="muted">まだコメントがありません。</p>'}<div class="video-comment-form"><input type="text" data-comment-input="${esc(post.id)}" placeholder="コメントする"><button type="button" class="secondary" data-comment-send="${esc(post.id)}">送信</button></div></div>`}
async function load(){const q='/.netlify/functions/ghost?channel=video&limit=100'+(session?'&token='+encodeURIComponent(session.token):'');const r=await fetch(q);const d=await r.json();const feed=document.getElementById('feed');feed.innerHTML=(d.posts||[]).map(p=>{const likes=p.likes||[];const liked=session&&likes.includes(session.email);const canDelete=session&&(session.email===p.authorEmail||session.isAdmin);const media=(p.media||[]).filter(m=>['videoFile','videoBlob','videoUrl'].includes(m.kind));const isLive=p.contentType==='live'&&p.isLive===true;return `<article class="card video-card" data-post="${esc(p.id)}"><h3>${esc(p.title||'動画')}</h3><div class="muted">${esc(p.authorProfile?.displayName||p.authorName||'ユーザー')} · ${new Date(p.createdAt).toLocaleString('ja-JP')}</div><div class="ghost-text-content">${NetrifyLanguage.renderText(p.description||p.text||'')}</div>${isLive?'<div class="video-player" style="display:grid;place-items:center;color:white"><div><strong>🔴 LIVE配信中</strong><p>リアルタイム映像とチャットを視聴できます</p></div></div>':`<div class="video-player">${media.map(renderVideo).join('')||'<p class="muted" style="padding:20px">動画がありません。</p>'}</div>`}<div class="video-actions">${isLive?`<a class="secondary" href="/Ghost/live.html?id=${encodeURIComponent(p.id)}" style="padding:7px 11px;border:1px solid var(--border);border-radius:8px">ライブを視聴・チャット</a>`:''}<button type="button" class="${liked?'':'ghost'}" data-like="${esc(p.id)}">♥ ${likes.length}</button><button type="button" class="ghost" data-toggle-comments="${esc(p.id)}">💬 ${(p.comments||[]).length}</button><button type="button" class="ghost" data-bookmark="${esc(p.id)}">🔖 保存</button>${canDelete?`<button type="button" class="ghost" data-delete="${esc(p.id)}">削除</button>`:''}<a class="ghost" href="/Ghost/post/${encodeURIComponent(p.id)}" style="padding:7px 11px;border:1px solid var(--border);border-radius:8px;">詳細</a></div>${renderComments(p)}</article>`}).join('')||'<p class="muted">まだ通常動画がありません。</p>';NetrifyLanguage.refresh();bind();}
function bind(){const feed=document.getElementById('feed');feed.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{const s=Netrify.requireLogin();if(!s)return;await Netrify.api('/.netlify/functions/ghost',{action:'likePost',token:s.token,postId:b.dataset.like});load()});feed.querySelectorAll('[data-toggle-comments]').forEach(b=>b.onclick=()=>{const box=document.getElementById('comments-'+b.dataset.toggleComments);box.hidden=!box.hidden});feed.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=async()=>{const s=Netrify.requireLogin();if(!s)return;try{const lists=await fetch('/.netlify/functions/ghost?bookmarks=1&listsOnly=1&token='+encodeURIComponent(s.token)).then(r=>r.json());const list=lists.lists?.[0]||{id:'saved'};await Netrify.api('/.netlify/functions/ghost',{action:'bookmarkPost',token:s.token,postId:b.dataset.bookmark,listId:list.id,save:true});b.textContent='✓ 保存済み'}catch(e){alert(e.message)}});feed.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const s=Netrify.requireLogin();if(!s||!(await MixAllDialog.confirm('この動画を削除しますか？')))return;try{await Netrify.api('/.netlify/functions/ghost',{action:'deletePost',token:s.token,postId:b.dataset.delete});load()}catch(e){alert(e.message)}});feed.querySelectorAll('[data-comment-send]').forEach(b=>b.onclick=async()=>{const s=Netrify.requireLogin();if(!s)return;const input=feed.querySelector(`[data-comment-input="${b.dataset.commentSend}"]`);if(!input.value.trim())return;await Netrify.api('/.netlify/functions/ghost',{action:'addComment',token:s.token,postId:b.dataset.commentSend,text:input.value.trim()});load()})}
load();document.addEventListener('netrify-language-ready',load);
</script><script src="/js/ghost-nav.js"></script></body></html>
