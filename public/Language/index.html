<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>特殊言語辞書 - MixAll</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/settings.js"></script><script src="/js/auth.js"></script>
<style>
.language-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.language-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--panel-2)}
.glyph-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.glyph{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px;cursor:pointer}.glyph:hover{outline:2px solid rgba(80,120,220,.3)}.glyph img{width:42px;height:42px;object-fit:contain}.glyph small{display:block;max-width:100px;word-break:break-word}.input-box{min-height:96px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2);padding:10px;line-height:1.8}.input-box img{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin:2px}.entry-row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--border);padding:10px 0}.entry-row img{width:52px;height:52px;object-fit:contain}.muted{color:var(--muted)}
</style><script src="/js/mixall-nav.js" defer></script>
<script src="/js/language-input.js"></script>

  <meta name="description" content="特殊言語辞書 - MixAll。MixAllのサービスページです。">

<body><header class="top"><div class="brand"><a href="/" style="color:inherit">Mix<span>All</span></a></div><nav class="services"><a href="/Uch">Uch</a><a href="/Pocket">ぽけっと</a><a href="/Language" class="active">特殊言語辞書</a></nav></header>
<main>
<section class="card"><h2>架空言語・特殊言語を追加</h2><p class="muted">フォントではなく、文字の見た目を画像として登録します。登録した文字は下の入力欄へクリックで挿入できます。</p><div class="row"><input id="languageName" placeholder="言語名（例：星影語）"><input id="languageDescription" placeholder="説明（任意）"></div><div id="languageError" class="error"></div><button id="createLanguage">辞書を作成</button></section>
<section class="card"><h2>文字画像を追加</h2><label>辞書を選択<select id="entryLanguage"><option value="">辞書を選択してください</option></select></label><div class="row"><input id="entryLabel" placeholder="文字の名前（例：ka）"><input id="entryMeaning" placeholder="意味・読み（任意）"></div><input id="entryImage" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><div id="entryError" class="error"></div><button id="addEntry">この画像を文字として登録</button></section>
<section class="card"><h2>文字を入力する</h2><label>辞書を選択<select id="languageSelect"><option value="">辞書を選択してください</option></select></label><p class="muted">文字ボタンを押すと、画像文字が入力欄に追加されます。</p><div id="glyphPalette" class="glyph-list"><span class="muted">辞書を選択してください。</span></div><div id="glyphInput" class="input-box" contenteditable="true" role="textbox" aria-label="特殊文字入力"></div><div class="row" style="margin-top:8px"><button class="secondary" id="clearInput">入力をクリア</button><button id="copyInput">画像文字をコピー</button></div><p id="copyStatus" class="muted"></p></section>
<section class="card"><h2>登録されている文字</h2><div id="languageList" class="language-grid"><p class="muted">読み込み中...</p></div></section>
</main>
<script>
const session=Netrify.requireLogin();let languages=[];
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selected(){return languages.find(x=>x.id===$("languageSelect").value)}
function render(){
  const options='<option value="">辞書を選択してください</option>'+languages.map(l=>`<option value="${esc(l.id)}">${esc(l.name)} (${(l.entries||[]).length}文字)</option>`).join('');
  $("languageSelect").innerHTML=options;$("entryLanguage").innerHTML=options;
  $("languageList").innerHTML=languages.length?languages.map(l=>`<article class="language-card"><h3>${esc(l.name)}</h3><p class="muted">${esc(l.description||'説明なし')}</p><div>${(l.entries||[]).map(e=>`<div class="entry-row"><img src="${esc(e.imageDataUrl)}" alt="${esc(e.label)}"><div><strong>${esc(e.label)}</strong><div class="muted">${esc(e.meaning||'意味未設定')}</div></div></div>`).join('')||'<span class="muted">まだ文字がありません。</span>'}</div></article>`).join(''):'<p class="muted">まだ辞書がありません。</p>';
  renderPalette();
}
function renderPalette(){const l=selected();$("glyphPalette").innerHTML=l&&l.entries.length?l.entries.map(e=>`<button class="glyph" type="button" data-glyph="${esc(e.id)}"><img src="${esc(e.imageDataUrl)}" alt="${esc(e.label)}"><small>${esc(e.label)}<br><span class="muted">${esc(e.meaning||'')}</span></small></button>`).join(''):'<span class="muted">この辞書にはまだ文字がありません。</span>';document.querySelectorAll('[data-glyph]').forEach(b=>b.onclick=()=>{const e=l.entries.find(x=>x.id===b.dataset.glyph);if(!e)return;const img=document.createElement('img');img.src=e.imageDataUrl;img.alt=e.label;img.title=e.meaning||e.label;$("glyphInput").appendChild(img);$("glyphInput").focus()})}
async function load(){const r=await fetch('/.netlify/functions/languages?token='+encodeURIComponent(session.token));if(!r.ok)throw new Error('辞書を取得できません');languages=(await r.json()).languages||[];render()}
$("createLanguage").onclick=async()=>{const error=$("languageError");error.textContent='';try{await Netrify.api('/.netlify/functions/languages',{action:'createLanguage',token:session.token,name:$("languageName").value,description:$("languageDescription").value});$("languageName").value='';$("languageDescription").value='';await load()}catch(e){error.textContent=e.message}};
$("addEntry").onclick=async()=>{const error=$("entryError");error.textContent='';const file=$("entryImage").files[0];if(!$("entryLanguage").value||!$("entryLabel").value.trim()||!file){error.textContent='辞書・文字名・画像を指定してください';return}try{const reader=new FileReader();const image=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});await Netrify.api('/.netlify/functions/languages',{action:'addEntry',token:session.token,languageId:$("entryLanguage").value,label:$("entryLabel").value,meaning:$("entryMeaning").value,imageDataUrl:image});$("entryLabel").value='';$("entryMeaning").value='';$("entryImage").value='';await load();$("languageSelect").value=$("entryLanguage").value;renderPalette()}catch(e){error.textContent=e.message}};
$("languageSelect").onchange=renderPalette;$("clearInput").onclick=()=>{$("glyphInput").replaceChildren();$("copyStatus").textContent=''};
$("copyInput").onclick=async()=>{const box=$("glyphInput");if(!box.innerHTML.trim()){ $("copyStatus").textContent='コピーする文字がありません。';return; }const text=box.innerText.trim();const html=box.innerHTML;try{if(navigator.clipboard&&window.ClipboardItem&&navigator.clipboard.write){const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})});await navigator.clipboard.write([item]);}else{const range=document.createRange();range.selectNodeContents(box);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);const copied=document.execCommand('copy');selection.removeAllRanges();if(!copied)throw new Error('copy failed');}$("copyStatus").textContent='画像文字をコピーしました。対応アプリに貼り付けできます。';}catch(e){try{await navigator.clipboard.writeText(text);$("copyStatus").textContent='文字名をテキストとしてコピーしました（画像貼り付けに対応するアプリではありません）。';}catch(_){$("copyStatus").textContent='コピーできませんでした。入力欄を選択して長押し／右クリックからコピーしてください。';}}};
load().catch(e=>{$("languageList").innerHTML=`<p class="error">${esc(e.message)}</p>`});
</script></body></html>
