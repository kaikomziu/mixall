  <meta name="description" content="Mail - MixAll +（ミックスオールプラス）。MixAll +のサービスページです。">

<body>
<header class="top"><div class="brand"><a href="/" style="color:inherit;"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/Uch">Uch</a><a href="/Pocket">ぽけっと</a><a href="/Ghost">Ghost</a><a href="/Mail/Compose/">新規メール</a><a href="/Mail/Inbox/">受信トレイ</a><a href="/Mail/Sent/">送信済み</a><a href="/Mail/All/">全てのメール</a><a href="/">トップへ</a></nav></header>
<main>
  <div class="mail-layout">
    <aside class="card mail-sidebar">
      <div class="mail-brand">Mail</div>
      <a class="button compose-button" id="composeBtn" href="/Mail/Compose/">＋ 新規メール</a>
      <a class="button secondary" data-view="inbox" href="/Mail/Inbox/">受信トレイ <span id="unreadCount"></span></a>
      <a class="button secondary" data-view="sent" href="/Mail/Sent/">送信済み</a>
      <a class="button secondary" data-view="all" href="/Mail/All/">すべてのメール</a>
      <p class="muted">フォルダーはそれぞれ専用URLで開けます。「ぽけっと」とは別のデータです。</p>
    </aside>
    <section>
      <div class="card" id="composeCard" style="display:none;">
        <div class="row" style="justify-content:space-between;"><h2 style="margin:0;">新規メール</h2><button type="button" class="ghost" id="closeCompose">閉じる</button></div>
        <input type="text" id="mailTo" placeholder="MixAll +アカウントまたはGmailなどのメールアドレス" />
        <input type="text" id="mailSubject" placeholder="件名" />
        <textarea id="mailBody" placeholder="本文"></textarea>
        <input type="file" id="mailAttachment" />
        <div id="mailAttachmentName" class="muted"></div>
        <p class="muted">Gmailなど外部宛ての送信には運営側のメール連携設定が必要です。外部宛て添付は1ファイル4MiBまでです。受信やGmailからの返信はMixAll +へ自動取り込みされません。</p>
        <div class="error" id="mailError"></div><button id="mailSubmit">送信</button>
      </div>
      <div class="card" id="mailListCard">
        <div class="row" style="justify-content:space-between;"><div><h2 id="folderTitle" style="margin:0;">受信トレイ</h2><p class="muted" style="margin:4px 0 0;">あなたのメールボックス</p></div><div class="row"><input type="search" id="mailSearch" placeholder="メールを検索" style="margin:0;" /><button type="button" class="secondary" id="mailSearchBtn">検索</button></div></div>
        <div id="inbox" style="margin-top:12px;"><p class="muted">読み込み中...</p></div>
      </div>
    </section>
  </div>
</main>
<script src="/js/auth.js"></script>
<script>
const session = Netrify.requireLogin();
const mailPath = window.location.pathname.replace(/\/+$/, '').toLowerCase() || '/';
const pathView = mailPath === '/mail/sent' ? 'sent' : (mailPath === '/mail/all' ? 'all' : (mailPath === '/mail/inbox' ? 'inbox' : (mailPath === '/mail/compose' ? 'compose' : '')));
const requestedView = pathView || new URLSearchParams(window.location.search).get('view') || 'inbox';
let currentView = ['inbox','sent','all'].includes(requestedView) ? requestedView : 'inbox';
let mailAttachment = null;
document.getElementById('mailAttachment').onchange = async (event) => { const file = event.target.files?.[0]; if (!file) { mailAttachment = null; return; } if (file.size > 10 * 1024 * 1024) { document.getElementById('mailError').textContent = '添付ファイルは10MB程度までです'; event.target.value=''; return; } mailAttachment = await new Promise((resolve) => { const reader = new FileReader(); reader.onload = () => resolve({ name:file.name, type:file.type, dataUrl:reader.result }); reader.readAsDataURL(file); }); document.getElementById('mailAttachmentName').textContent = `添付: ${file.name}`; };
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setCompose(open) { document.getElementById('composeCard').style.display = open ? 'block' : 'none'; document.getElementById('mailListCard').style.display = open ? 'none' : 'block'; }
async function loadInbox(view = currentView, query = document.getElementById('mailSearch').value.trim()) {
  if (!session) return;
  currentView = view;
  const title = { inbox:'受信トレイ', sent:'送信済み', all:'すべてのメール' }[view] || '受信トレイ';
  document.title = `${title} - Mail | MixAll +`;
  document.getElementById('folderTitle').textContent = title;
  const el = document.getElementById('inbox');
  try {
    const res = await fetch('/.netlify/functions/mail?token=' + encodeURIComponent(session.token) + '&view=' + encodeURIComponent(view) + '&q=' + encodeURIComponent(query));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `メールの取得に失敗しました（${res.status}）`);
    const unread = (data.threads || []).filter(t => t.unread).length;
    document.getElementById('unreadCount').textContent = unread ? `(${unread})` : '';
    if (!data.threads || data.threads.length === 0) { el.innerHTML = '<p class="muted">このフォルダにメールはありません。</p>'; return; }
    el.innerHTML = data.threads.map(t => `<a class="mail-row ${t.unread ? 'unread' : ''}" href="/Mail/Thread/${encodeURIComponent(t.id)}/" style="color:inherit;"><span class="presence-dot ${t.otherProfile && t.otherProfile.online ? 'online' : ''}"></span><div class="mail-main"><div class="mail-subject">${t.unread ? '● ' : ''}${escapeHtml(t.subject)}</div><div class="mail-preview">${escapeHtml(t.otherProfile?.displayName || t.otherEmail)} · ${escapeHtml(t.lastMessage?.text || '')}</div></div><div class="mail-meta">${t.externalDelivery?.status === 'failed' ? '外部送信失敗' : (t.externalDelivery?.status === 'sending' ? '外部送信中' : (t.externalDelivery?.status === 'sent' ? '外部送信済み' : (t.sentByMe ? '送信' : '受信')))}<br>${t.lastMessage ? new Date(t.lastMessage.createdAt).toLocaleDateString('ja-JP') : ''}</div></a>`).join('');
  } catch (error) {
    el.innerHTML = `<p class="error">${escapeHtml(error.message || 'メールを読み込めませんでした')}</p>`;
  }
}
const folderPaths={inbox:'/Mail/Inbox/',sent:'/Mail/Sent/',all:'/Mail/All/'};
document.getElementById('closeCompose').onclick = () => { window.location.href='/Mail/Inbox/'; };
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('active', x === b)); }));
document.getElementById('mailSearchBtn').onclick = () => loadInbox(currentView);
document.getElementById('mailSearch').addEventListener('keydown', e => { if (e.key === 'Enter') loadInbox(currentView); });
document.getElementById('mailSubmit').onclick = async () => { const err = document.getElementById('mailError'); err.textContent = ''; const to = document.getElementById('mailTo').value.trim(); const subject = document.getElementById('mailSubject').value.trim(); const body = document.getElementById('mailBody').value.trim(); if (!to || (!body && !mailAttachment)) { err.textContent = '宛先と本文または添付ファイルが必要です'; return; } try { const data = await Netrify.api('/.netlify/functions/mail', { action:'send', token:session.token, to, subject, body, displayName:session.displayName, attachment:mailAttachment }); window.location.href = '/Mail/thread.html?id=' + encodeURIComponent(data.thread.id); } catch(e) { err.textContent = e.message; } };
if(requestedView==='compose')setCompose(true);else loadInbox(currentView);
if(requestedView!=='compose')setInterval(() => loadInbox(currentView), 8000);
</script>
</body>
</html>
