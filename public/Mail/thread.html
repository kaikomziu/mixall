<body>
<header class="top"><div class="brand"><a href="/" style="color:inherit;"><span class="brand-logo"><i class="brand-mark" aria-hidden="true"></i><span class="brand-word">Mix<span>All</span><b class="brand-plus">+</b></span></span></a></div><nav class="services"><a href="/Mail/Compose/">新規メール</a><a href="/Mail/Inbox/">受信トレイ</a><a href="/Mail/Sent/">送信済み</a><a href="/Mail/All/">全てのメール</a><a href="/">トップへ</a></nav></header>
<main>
  <div class="card"><div class="row" style="justify-content:space-between;"><a href="/Mail">← 受信トレイに戻る</a><button type="button" class="secondary" id="composeFromThread">新規メール</button></div></div>
  <div class="card" id="thread"><p class="muted">読み込み中...</p></div>
  <div class="card"><h3>返信</h3><textarea id="replyBody" placeholder="返信を入力"></textarea><input type="file" id="replyAttachment" /><div id="replyAttachmentName" class="muted"></div><div class="error" id="replyError"></div><button id="replySubmit">返信を送信</button></div>
</main>
<script src="/js/auth.js"></script>
<script>
const session = Netrify.requireLogin();
const threadId = new URLSearchParams(window.location.search).get('id');
let currentThread = null;
let replyAttachment = null;
document.getElementById('replyAttachment').onchange = async (event) => { const file = event.target.files?.[0]; if (!file) { replyAttachment = null; return; } if (file.size > 10 * 1024 * 1024) { document.getElementById('replyError').textContent = '添付ファイルは10MB程度までです'; event.target.value=''; return; } replyAttachment = await new Promise((resolve) => { const reader = new FileReader(); reader.onload = () => resolve({ name:file.name, type:file.type, dataUrl:reader.result }); reader.readAsDataURL(file); }); document.getElementById('replyAttachmentName').textContent = `添付: ${file.name}`; };
function renderAttachment(a) { if (!a || !a.dataUrl) return ''; return a.type && a.type.startsWith('image/') ? `<img src="${a.dataUrl}" alt="${escapeHtml(a.name)}" style="display:block;max-width:100%;width:auto;height:auto;max-height:50vh;object-fit:contain;border-radius:8px;" />` : `<a href="${a.dataUrl}" download="${escapeHtml(a.name)}">添付: ${escapeHtml(a.name)}</a>`; }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function identity(profile, email) { const p = profile || {}; return `<span class="identity ${p.isOfficial ? 'official-name' : ''}"><span class="presence-dot ${p.online ? 'online' : ''}"></span><span>${escapeHtml(p.displayName || email)}</span>${p.isOfficial ? '<span class="official-badge">公認</span>' : ''}</span>`; }
async function reportMessage(messageId) { const reason = (await MixAllDialog.prompt('通報理由を入力してください', '迷惑行為・規約違反')); if (!reason) return; const result = await Netrify.api('/.netlify/functions/mail', { action:'report', token:session.token, threadId, messageId, reason }); alert(result.duplicate ? 'このメールはすでに通報済みです。' : '通報を受け付けました。'); }
async function loadThread() { if (!session) return; const res = await fetch('/.netlify/functions/mail?threadId=' + encodeURIComponent(threadId) + '&token=' + encodeURIComponent(session.token)); const data = await res.json(); if (!res.ok) { document.getElementById('thread').innerHTML = `<p class="error">${escapeHtml(data.error || 'メールが見つかりません')}</p>`; return; } currentThread = data.thread; const profiles = currentThread.profiles || {}; document.title = currentThread.subject + ' - Mail'; const externalNotice=currentThread.externalRecipient?'<p class="audit-note">このスレッドは外部メール宛てです。相手がそのメールに返信すると、このスレッドに届きます（MixAll+ の共用アドレスから送信されます）。</p>':''; document.getElementById('thread').innerHTML = `${externalNotice}<div class="mail-header"><div><h2 style="margin:0;">${escapeHtml(currentThread.subject)}</h2><p class="muted" style="margin:4px 0 0;">${currentThread.messages.length}通のメール · ${escapeHtml(currentThread.memberEmails.join(' / '))}</p></div></div>${currentThread.messages.map(m => `<article class="mail-message"><div class="mail-header"><div>${identity(profiles[m.authorEmail] || m.authorProfile, m.authorEmail)}<div class="muted">From: ${escapeHtml(m.authorEmail)}<br>To: ${escapeHtml(currentThread.memberEmails.filter(e => e !== m.authorEmail).join(', '))}${m.externalDeliveryStatus==='failed'?'<br><span class="error">外部送信失敗</span>':(m.externalDeliveryStatus==='sent'?'<br>外部送信済み':'')}</div></div><span class="muted">${new Date(m.createdAt).toLocaleString('ja-JP')}</span></div><div style="white-space:pre-wrap;line-height:1.7;">${escapeHtml(m.text)}</div>${renderAttachment(m.attachment)}<div class="admin-actions"><button type="button" class="ghost" data-report-message="${escapeHtml(m.id)}">通報</button></div></article>`).join('')}`; document.querySelectorAll('[data-report-message]').forEach(b => b.onclick = () => reportMessage(b.dataset.reportMessage)); await Netrify.api('/.netlify/functions/mail', { action:'markRead', token:session.token, threadId }); }
document.getElementById('replySubmit').onclick = async () => { const err = document.getElementById('replyError'); err.textContent=''; const body = document.getElementById('replyBody').value.trim(); if (!body) { err.textContent='本文を入力してください'; return; } try { await Netrify.api('/.netlify/functions/mail', { action:'reply', token:session.token, threadId, subject:currentThread?.subject||'', body, displayName:session.displayName, attachment:replyAttachment }); document.getElementById('replyBody').value=''; loadThread(); } catch(e) { err.textContent=e.message; if(currentThread?.externalRecipient)loadThread(); } };
document.getElementById('composeFromThread').onclick = () => { window.location.href='/Mail/Compose/'; };
loadThread(); setInterval(loadThread, 8000);
</script>
</body></html>
