<body>
<header class="top">
  <div class="brand"><a href="/" style="color:inherit;">Mix<span>All</span></a></div>
  <nav class="services">
    <a href="/Uch" class="active">Uch (掲示板)</a>
    <a href="/Language">特殊言語辞書</a>
    <a href="/">トップへ</a>
  </nav>
</header>

<main>
  <div class="card">
    <h2>新規スレッド作成</h2>
    <input type="text" id="newTitle" placeholder="スレッドタイトル" />
    <input type="text" id="newTags" placeholder="スレタグ（カンマ区切り・例: 雑談,創作）" />
    <textarea id="newBody" placeholder="本文 (省略可)"></textarea>
    <select id="threadVisibility"><option value="public">公開</option><option value="approval">承認制</option><option value="password">パスワード</option><option value="url">一覧非表示・URL公開</option></select><input type="password" id="threadPassword" placeholder="パスワード（パスワード設定時）" />
    <div class="error" id="createError"></div>
    <button id="createSubmit">スレッドを立てる</button>
  </div>

  <div class="card">
    <h2>スレッド一覧</h2><input type="search" id="threadSearch" placeholder="タイトル・投稿者・タグを検索" />
    <label for="threadTagFilter">タグで絞り込み（複数選択）</label><select id="threadTagFilter" multiple size="4" aria-label="絞り込むタグを複数選択"></select>
    <label class="row"><input type="checkbox" id="matchAllTags"> 選択したタグすべてを含む部屋だけ表示（未チェックはどれか1つ）</label>
    <div id="activeTagList" class="row" aria-live="polite"></div>
    <div id="threadList"><p class="muted">読み込み中...</p></div>
  </div>
</main>

<script src="/js/auth.js"></script><script src="/js/uch-profile.js"></script>
<script>
const session = Netrify.getSession();
function identityHtml(profile, fallback) { const p = profile || {}; const roleClass=p.isAdmin?'operator-name':(p.isDeputyAdmin?'deputy-operator-name':(p.isOfficial?'official-name':'')); const roleBadge=p.isAdmin?'<span class="operator-badge">運営</span>':(p.isDeputyAdmin?'<span class="deputy-operator-badge">副運営</span>':(p.isOfficial?'<span class="official-badge">公認</span>':'')); return `<span class="identity ${roleClass}"><span class="presence-dot ${p.online ? 'online' : ''}"></span><span>${escapeHtml(p.uchName || p.displayName || fallback || '不明')}</span>${p.uchId ? `<span class="uch-id">@${escapeHtml(p.uchId)}</span>` : ''}${roleBadge}</span>`; }
async function loadThreads() {
  const tagSelect=document.getElementById('threadTagFilter'); const selected=[...tagSelect.selectedOptions].map(o=>o.value);
  const params=new URLSearchParams();if(session)params.set('token',session.token);const needle=document.getElementById('threadSearch').value.trim();if(needle)params.set('q',needle);if(selected.length)params.set('tags',selected.join(','));if(selected.length&&document.getElementById('matchAllTags').checked)params.set('match','all');
  const res = await fetch('/.netlify/functions/uch' + (params.size?'?'+params.toString():''));
  const data = await res.json();
  const el = document.getElementById('threadList');
  const allTags=Array.isArray(data.availableTags)?data.availableTags:[...new Set(data.threads.flatMap(t=>Array.isArray(t.tags)?t.tags:[]))].sort((a,b)=>a.localeCompare(b,'ja'));
  if(document.activeElement!==tagSelect){tagSelect.innerHTML=allTags.map(t=>`<option value="${escapeHtml(t)}">#${escapeHtml(t)}</option>`).join('');selected.forEach(t=>{const option=[...tagSelect.options].find(o=>o.value===t);if(option)option.selected=true;});}
  const tags=[...tagSelect.selectedOptions].map(o=>o.value); const matchAll=document.getElementById('matchAllTags').checked;
  if (!data.threads || data.threads.length === 0) {
    document.getElementById('activeTagList').innerHTML=tags.map(t=>`<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
    el.innerHTML = data.total ? '<p class="muted">検索条件に一致するスレッドがありません。タグやキーワードを変更してください。</p>' : '<p class="muted">まだスレッドがありません。最初の1件を立ててみましょう。</p>';
    return;
  }
  const filtered=data.threads;
  document.getElementById('activeTagList').innerHTML=tags.map(t=>`<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
  el.innerHTML = filtered.map(t => {
    const canDelete = session && (session.isAdmin || session.email === t.authorEmail);
    return `<div class="thread-list-item"><div><a href="/Uch/thread.html?id=${encodeURIComponent(t.id)}" style="color:inherit;"><div class="title">${escapeHtml(t.title)}</div><div class="meta">${identityHtml(t.authorProfile, t.author)} ・ ${t.postCount}件の投稿</div>${t.excerpt?`<div class="muted">${escapeHtml(t.excerpt)}</div>`:''}${(t.tags||[]).length?`<div class="row">${t.tags.map(tag=>`<button type="button" class="tag-chip" data-pick-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</button>`).join('')}</div>`:''}</a></div><div class="row"><button type="button" class="ghost" data-report-thread="${escapeHtml(t.id)}">通報</button>${canDelete ? `<button type="button" class="ghost" data-delete-thread="${escapeHtml(t.id)}">削除</button>` : ''}</div></div>`;
  }).join('');
  el.querySelectorAll('[data-report-thread]').forEach((button) => button.onclick = async () => {
    const s = Netrify.requireLogin(); if (!s) return;
    const reason = prompt('通報理由を入力してください', '迷惑行為・規約違反'); if (!reason) return;
    const result = await Netrify.api('/.netlify/functions/uch', { action:'report', token:s.token, threadId:button.dataset.reportThread, reason });
    alert(result.duplicate ? 'このスレッドはすでに通報済みです。' : '通報を受け付けました。');
  });
  el.querySelectorAll('[data-pick-tag]').forEach((button)=>button.onclick=(event)=>{event.preventDefault();const option=[...tagSelect.options].find(o=>o.value===button.dataset.pickTag);if(option)option.selected=true;loadThreads();});
  el.querySelectorAll('[data-delete-thread]').forEach((button) => button.onclick = async () => {
    if (!confirm('このスレッドを削除しますか？')) return;
    const s = Netrify.requireLogin(); if (!s) return;
    await Netrify.api('/.netlify/functions/uch', { action:'deleteThread', token:s.token, threadId:button.dataset.deleteThread }); loadThreads();
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('createSubmit').onclick = async () => {
  const session = Netrify.requireLogin();
  if (!session) return;
  const title = document.getElementById('newTitle').value;
  const body = document.getElementById('newBody').value;
  const errEl = document.getElementById('createError');
  errEl.textContent = '';
  try {
    const data = await Netrify.api('/.netlify/functions/uch', {
      action: 'createThread', token: session.token, title, body, tags:document.getElementById('newTags').value.split(/[,、#\n]+/).map(x=>x.trim()).filter(Boolean), visibility:document.getElementById('threadVisibility').value, password:document.getElementById('threadPassword').value, displayName: session.displayName
    });
    window.location.href = '/Uch/thread.html?id=' + encodeURIComponent(data.thread.id);
  } catch (e) {
    errEl.textContent = e.message;
  }
};

loadThreads();
document.getElementById('threadSearch').addEventListener('input', loadThreads);
document.getElementById('threadTagFilter').addEventListener('change',loadThreads);
document.getElementById('matchAllTags').addEventListener('change',loadThreads);
setInterval(loadThreads, 8000); // 常時更新
</script>
</body>
</html>
