<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MixAll 緊急通信HTML</title><style>body{max-width:900px;margin:0 auto;padding:18px;font-family:system-ui,sans-serif;background:#111827;color:#f3f4f6}.hero,.card{border:1px solid #374151;border-radius:16px;padding:18px;margin:12px 0;background:#1f2937}.hero{border-color:#d96b55;background:#3b1f24}.peer-status{font-weight:700}.peer-status[data-kind=ok]{color:#6ee7b7}.peer-status[data-kind=bad]{color:#fca5a5}.code,textarea{width:100%;box-sizing:border-box;min-height:120px;background:#111827;color:#f3f4f6;border:1px solid #4b5563;border-radius:8px;padding:9px;font-family:monospace}.peer-message{border:1px solid #4b5563;border-radius:10px;padding:9px;margin:7px 0}.peer-message small{color:#9ca3af;display:block}button{padding:9px 12px;border:0;border-radius:8px;background:#2563eb;color:white;margin:4px 0;cursor:pointer}.secondary{background:#4b5563}.note{border-left:4px solid #f59e0b;padding:10px 12px;background:#3b2f16}input{box-sizing:border-box;width:100%;padding:9px;border-radius:8px;border:1px solid #4b5563;background:#111827;color:#fff}</style><meta property="og:type" content="website"><meta property="og:site_name" content="MixAll"><meta property="og:title" content="MixAll緊急通信"><meta property="og:description" content="MixAll緊急通信のページ"><meta property="og:image" content="https://mix-alls.netlify.app/ogp/17-emergency.jpg?v=20261012-2">

</head><style>body{max-width:1000px;margin:0 auto;padding:18px;font-family:system-ui,sans-serif;background:#0b1220;color:#f3f4f6}.hero,.card{border:1px solid #344154;border-radius:16px;padding:18px;margin:12px 0;background:#151f30}.hero{border-color:#d96b55;background:linear-gradient(135deg,#3b1f24,#182b42)}.status{font-weight:700}.ok{color:#6ee7b7}.bad{color:#fca5a5}.tree{font-family:monospace;white-space:pre-wrap;background:#0b1220;border:1px solid #344154;border-radius:10px;padding:14px;min-height:130px}.metric{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.metric div{padding:10px;border:1px solid #344154;border-radius:10px}.metric b{display:block;font-size:1.3rem}textarea,input,button{font:inherit}textarea,input{width:100%;padding:9px;border-radius:8px;border:1px solid #4b5563;background:#0b1220;color:#fff}textarea{min-height:80px}button{padding:9px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.warning{border-left:4px solid #f59e0b;background:#302613}.message{border:1px solid #344154;border-radius:10px;padding:9px;margin:7px 0}.message small{display:block;color:#aab4c4}.muted{color:#aab4c4}</style><body><section class="hero"><h1>MixAll 緊急通信</h1><p>起動するとコード入力なしで、保存済み候補を読み込み、成功率とRTTの高い順に自動接続します。</p><p id="status" class="status">緊急用通信を読み込んでいます…</p></section><section class="card"><h2>接続ツリー</h2><div id="tree" class="tree">自分を起点に候補を確認しています…</div><div class="metric"><div><b id="connected">0</b>接続済み</div><div><b id="attempted">0</b>試行</div><div><b id="successRate">0%</b>成功率</div><div><b id="avgRtt">—</b>平均RTT</div></div></section><section class="card"><h2>緊急メッセージ</h2><form id="sendForm"><input id="author" placeholder="名前（任意）"><textarea id="text" placeholder="安否・集合場所・必要な物資など"></textarea><button type="submit">接続済み端末へ送信</button></form><div id="messages"><p class="muted">接続後に受信した内容が表示されます。</p></div></section><section class="card warning"><h2>自動接続について</h2><p>このファイルは保存済み候補だけを使います。候補が空、期限切れ、または端末間に通信経路がない場合は接続できません。候補の配布・更新は通信可能な平常時にサイト側で行ってください。</p></section><script>(()=>{const MAX=8,ID=localStorage.getItem('mixall_emergency_device_id')||crypto.randomUUID();localStorage.setItem('mixall_emergency_device_id',ID);const $=i=>document.getElementById(i),S={channels:new Set(),nodes:new Map([[ID,{id:ID,parent:null}]]),seen:new Set(JSON.parse(localStorage.getItem('mixall_seen_emergency_messages')||'[]').slice(-500)),attempted:0,success:0,samples:[],probes:new Map()};const set=(t,c='')=>{$('status').textContent=t;$('status').className='status '+c};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tree(){const ch=new Map;for(const n of S.nodes.values())if(n.parent){if(!ch.has(n.parent))ch.set(n.parent,[]);ch.get(n.parent).push(n)}function w(id,p=''){let o=id===ID?'自分':id.slice(0,12);for(const n of ch.get(id)||[])o+='\n'+p+'├─ '+w(n.id,p+'│  ');return o}$('tree').textContent=w(ID);$('connected').textContent=S.success;$('attempted').textContent=S.attempted;$('successRate').textContent=S.attempted?Math.round(S.success/S.attempted*100)+'%':'0%';const g=S.samples.filter(x=>x.ok);$('avgRtt').textContent=g.length?Math.round(g.reduce((a,x)=>a+x.rtt,0)/g.length)+'ms':'—'}function broadcast(m,ex){const x=JSON.stringify(m);for(const c of S.channels)if(c!==ex&&c.readyState==='open')try{c.send(x)}catch(_){}}function show(m,incoming,relay){const r=$('messages');if(r.querySelector('.muted'))r.innerHTML='';const a=document.createElement('article');a.className='message';a.innerHTML='<small>'+(incoming?'受信':'送信')+(relay?'・中継':'')+' · '+new Date(m.createdAt||Date.now()).toLocaleString('ja-JP')+'</small><strong>'+esc(m.author||'匿名')+'</strong><p>'+esc(m.text)+'</p>';r.prepend(a)}function handle(m,src){if(!m)return;if(m.type==='probe'){try{src.send(JSON.stringify({type:'ack',id:m.id,from:ID}))}catch(_){ }return}if(m.type==='ack'){const t=S.probes.get(m.id);if(t){S.probes.delete(m.id);S.samples.push({ok:true,rtt:Math.round(performance.now()-t)});tree()}return}if(m.type!=='emergencyMessage')return;const id=m.messageId||m.id;if(!id||S.seen.has(id))return;S.seen.add(id);localStorage.setItem('mixall_seen_emergency_messages',JSON.stringify([...S.seen].slice(-500)));show(m,true,Number(m.hop||0)>0);const ttl=Number(m.ttl??MAX)-1;if(ttl>0&&!(m.path||[]).includes(ID))broadcast({...m,hop:Number(m.hop||0)+1,ttl,path:[...(m.path||[]),ID]},src)}function attach(c,cand,pc){S.channels.add(c);const st=performance.now();c.onopen=()=>{S.success++;S.samples.push({ok:true,rtt:Math.round(performance.now()-st)});S.nodes.set(cand.peerId||cand.deviceId||cand.candidateId,{id:cand.peerId||cand.deviceId||cand.candidateId,parent:ID});set('P2P接続済み。接続ツリーを拡張しています…','ok');tree();probe()};c.onclose=()=>{S.channels.delete(c);tree()};c.onmessage=e=>{try{handle(JSON.parse(e.data),c)}catch(_){}}}function probe(){const id=crypto.randomUUID();S.probes.set(id,performance.now());broadcast({type:'probe',id,from:ID});setTimeout(()=>{if(S.probes.delete(id)){S.samples.push({ok:false});tree()}},5000)}async function allCandidates(){let a=[];try{a=JSON.parse(localStorage.getItem('mixall_bootstrap_candidates')||'[]')}catch(_){}try{const db=await new Promise((ok,no)=>{const r=indexedDB.open('mixall-emergency-mesh',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('candidates'))r.result.createObjectStore('candidates',{keyPath:'candidateId'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});a=a.concat(await new Promise((ok,no)=>{const r=db.transaction('candidates').objectStore('candidates').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)}))}catch(_){}return [...new Map(a.filter(x=>x&&x.localOffer&&x.remoteAnswer&&(!x.expiresAt||new Date(x.expiresAt)>new Date())).map(x=>[x.candidateId||x.peerId, x])).values()].sort((x,y)=>(y.lastSuccessRate||0)-(x.lastSuccessRate||0)||(x.avgRttMs||99999)-(y.avgRttMs||99999))}async function attempt(c){S.attempted++;tree();const pc=new RTCPeerConnection({iceServers:[]});const dc=pc.createDataChannel('mixall-emergency');attach(dc,c,pc);try{await pc.setLocalDescription(c.localOffer);await pc.setRemoteDescription(c.remoteAnswer)}catch(_){pc.close()}return new Promise(r=>setTimeout(r,2500))}async function start(){try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(_){}const cs=await allCandidates();if(!cs.length){set('保存済み候補を待機中。平常時にサイトから更新してください。','bad');tree();return}set('保存済み候補を成功率順に自動試行しています…');for(const c of cs)await attempt(c);set(S.success?'接続ツリーを構築中です。':'候補はありますが接続できませんでした。',S.success?'ok':'bad');setInterval(probe,15000)}$('sendForm').addEventListener('submit',e=>{e.preventDefault();const t=$('text').value.trim();if(!t||!S.channels.size)return;const m={type:'emergencyMessage',messageId:crypto.randomUUID(),origin:ID,author:$('author').value.trim()||'匿名',text:t,createdAt:Date.now(),hop:0,ttl:MAX,path:[ID]};S.seen.add(m.messageId);broadcast(m);show(m,false,false);$('text').value=''});tree();start()})()</script>
