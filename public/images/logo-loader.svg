<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- 読み込み画面用のアニメーションロゴ: 4色の腕が集まって「+」になり、まわりを光の輪が回る -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fdcff"/><stop offset="1" stop-color="#2b55ff"/></linearGradient>
    <linearGradient id="r" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#b57aff"/><stop offset="1" stop-color="#5a33ff"/></linearGradient>
    <linearGradient id="b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6ab4"/><stop offset="1" stop-color="#ff3366"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3dffb8"/><stop offset="1" stop-color="#0daa93"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fdcff"/><stop offset="0.5" stop-color="#8b6bff"/><stop offset="1" stop-color="#ff5c9a"/></linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#c7b8ff" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <style>
    .arm { animation: gather 0.9s cubic-bezier(.2,.9,.25,1.15) both; transform-box: view-box; transform-origin: 120px 120px; }
    .a1 { --dx: 0px; --dy: -46px; animation-delay: 0s; }
    .a2 { --dx: 46px; --dy: 0px; animation-delay: .08s; }
    .a3 { --dx: 0px; --dy: 46px; animation-delay: .16s; }
    .a4 { --dx: -46px; --dy: 0px; animation-delay: .24s; }
    @keyframes gather { from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.6); } to { opacity: 1; transform: none; } }
    .plus { animation: breathe 2.2s ease-in-out 1s infinite; transform-box: view-box; transform-origin: 120px 120px; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .core { animation: pulse 2.2s ease-in-out .7s infinite; transform-box: view-box; transform-origin: 120px 120px; opacity: 0; }
    @keyframes pulse { 0% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } 100% { opacity: .55; transform: scale(.85); } }
    .spin { animation: spin 1.4s linear infinite; transform-box: view-box; transform-origin: 120px 120px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .halo { animation: halo 2.2s ease-in-out infinite; transform-box: view-box; transform-origin: 120px 120px; }
    @keyframes halo { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
    @media (prefers-reduced-motion: reduce) { .arm, .plus, .core, .spin, .halo { animation: none; opacity: 1; } }
  </style>

  <circle class="halo" cx="120" cy="120" r="84" fill="#7b5cff" opacity=".35" filter="url(#blur)"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="3"/>
  <g class="spin">
    <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" stroke-dasharray="120 534"/>
    <circle cx="224" cy="120" r="5" fill="#ffffff"/>
  </g>
  <g class="plus">
    <rect class="arm a1" x="100" y="58" width="40" height="80" rx="20" fill="url(#t)"/>
    <rect class="arm a2" x="102" y="100" width="80" height="40" rx="20" fill="url(#r)"/>
    <rect class="arm a3" x="100" y="102" width="40" height="80" rx="20" fill="url(#b)"/>
    <rect class="arm a4" x="58" y="100" width="80" height="40" rx="20" fill="url(#l)"/>
    <circle class="core" cx="120" cy="120" r="24" fill="url(#core)"/>
  </g>
</svg>
