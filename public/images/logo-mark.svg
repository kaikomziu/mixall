<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MixAll + のロゴマーク: 4色の光（チャット・SNS・掲示板・ツール）が中央で混ざって「+」になる -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#06070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9d8bff" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#5b6cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fdcff"/>
      <stop offset="1" stop-color="#2b55ff"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#b57aff"/>
      <stop offset="1" stop-color="#5a33ff"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6ab4"/>
      <stop offset="1" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dffb8"/>
      <stop offset="1" stop-color="#0daa93"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mix" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0ff"/><stop offset="0.5" stop-color="#c7b8ff"/><stop offset="1" stop-color="#ff7fb0"/></linearGradient>
    <filter id="core" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- 光のにじみ -->
  <g filter="url(#soft)" opacity="0.55">
    <rect x="212" y="92" width="88" height="164" rx="44" fill="#4f8cff"/>
    <rect x="256" y="212" width="164" height="88" rx="44" fill="#8a63ff"/>
    <rect x="212" y="256" width="88" height="164" rx="44" fill="#ff5a96"/>
    <rect x="92" y="212" width="164" height="88" rx="44" fill="#2fd6b4"/>
  </g>

  <!-- 4本の腕。中央で4色が混ざって白く光る -->
  <g>
    <rect x="212" y="92" width="88" height="208" rx="44" fill="url(#top)"/>
    <rect x="212" y="212" width="208" height="88" rx="44" fill="url(#right)"/>
    <rect x="212" y="212" width="88" height="208" rx="44" fill="url(#bottom)"/>
    <rect x="92" y="212" width="208" height="88" rx="44" fill="url(#left)"/>
  </g>
  <rect x="212" y="212" width="88" height="88" rx="40" fill="url(#mix)"/>
  <circle cx="256" cy="256" r="40" fill="#ffffff" opacity="0.85" filter="url(#core)"/>
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>

  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
  <path d="M118 0h276a118 118 0 0 1 118 118v34C396 214 116 214 0 152v-34A118 118 0 0 1 118 0z" fill="url(#shine)"/>
</svg>
