<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード再設定 - MixAll</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/settings.js"></script>
  <script src="/js/mixall-nav.js" defer></script>
  <style>
    .reset-wrap{max-width:560px;margin:8vh auto;padding:0 16px}.reset-note{line-height:1.7}
  </style>

  <meta property="og:title" content="パスワード再設定 - MixAll">
  <meta property="og:description" content="MixAllのサービスと便利な機能をご紹介します。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mix-alls.netlify.app/reset-password/">
  <meta property="og:image" content="https://mix-alls.netlify.app/ogp/14-website-creation.jpg?v=20261012-2">
  <meta property="og:image:secure_url" content="https://mix-alls.netlify.app/ogp/14-website-creation.jpg?v=20261012-2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://mix-alls.netlify.app/ogp/14-website-creation.jpg?v=20261012-2">
</head>
<body>
  <header class="top"><div class="brand"><a href="/" style="color:inherit">Mix<span>All</span></a></div><nav class="services"><a href="/account/">アカウント</a><a href="/">トップへ</a></nav></header>
  <main class="reset-wrap">
    <section class="card">
      <h1>パスワードを再設定</h1>
      <p class="muted reset-note">メールで受け取った有効なリンクを使って、新しいパスワードを設定してください。完了すると、現在ログイン中のすべての端末がログアウトされます。</p>
      <label for="newPassword">新しいパスワード（6文字以上）</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
      <label for="confirmPassword">新しいパスワード（確認）</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
      <div id="resetStatus" class="muted" role="status" aria-live="polite"></div>
      <div id="resetError" class="error" role="alert"></div>
      <button id="resetSubmit" type="button">パスワードを更新</button>
    </section>
  </main>
  <script src="/js/auth.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const statusEl = document.getElementById('resetStatus');
    const errorEl = document.getElementById('resetError');
    const button = document.getElementById('resetSubmit');
    if (!/^[a-f0-9]{64}$/.test(token)) {
      errorEl.textContent = '再設定リンクが不正か、URLからトークンが抜けています。メールからリンクを開き直してください。';
      button.disabled = true;
    }
    button.onclick = async () => {
      errorEl.textContent = '';
      statusEl.textContent = '';
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password.length < 6) { errorEl.textContent = 'パスワードは6文字以上にしてください。'; return; }
      if (password !== confirmPassword) { errorEl.textContent = '確認用パスワードが一致しません。'; return; }
      button.disabled = true;
      try {
        await Netrify.api('/.netlify/functions/auth', { action:'resetPassword', resetToken:token, newPassword:password });
        if (typeof Netrify.clearSession === 'function') Netrify.clearSession();
        statusEl.textContent = 'パスワードを更新しました。全端末からログアウトしました。ログイン画面へ移動します。';
        setTimeout(() => { location.href = '/account/?reset=1'; }, 1800);
      } catch (error) {
        errorEl.textContent = error.message || '再設定リンクが無効か、有効期限が切れています。もう一度再設定メールを依頼してください。';
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
